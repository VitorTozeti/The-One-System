<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nexus RPG — Protótipo</title>
<!--
  Nexus RPG — Protótipo (Mestre + Jogador)
  Arquivo ÚNICO e 100% OFFLINE. Sem internet, sem CDN, sem instalação.
  Abra com dois cliques. Dados salvos no navegador (LocalStorage).
-->
<style>
  :root{
    --bg:#0b1020; --panel:#141a2e; --panel2:#101527; --line:#2a3350;
    --txt:#e2e8f0; --muted:#94a3b8; --dim:#64748b;
    --indigo:#6366f1; --indigo2:#4f46e5; --emerald:#10b981; --amber:#d97706; --rose:#e11d48;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
  button{font-family:inherit;cursor:pointer;border:none}
  input,select,textarea{font-family:inherit}
  textarea.in{resize:vertical;min-height:52px}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:#334155;border-radius:8px}

  header.top{position:sticky;top:0;z-index:10;background:rgba(11,16,32,.92);backdrop-filter:blur(6px);border-bottom:1px solid #1e293b}
  .bar{max-width:900px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .logo{font-weight:900;letter-spacing:.5px}
  .logo span{color:var(--indigo)}
  .logo small{display:block;font-size:10px;color:var(--dim);font-weight:400;letter-spacing:1px}

  .toggle{display:flex;background:#1e293b;border-radius:12px;padding:4px}
  .toggle button{padding:8px 14px;border-radius:9px;font-size:14px;font-weight:700;background:transparent;color:var(--muted);transition:.15s}
  .toggle button.on-m{background:var(--indigo2);color:#fff}
  .toggle button.on-j{background:var(--emerald);color:#04231a}

  main{padding:24px 16px}
  .wrap{max-width:900px;margin:0 auto}
  .wrap-sm{max-width:680px;margin:0 auto}

  .note{font-size:14px;color:var(--muted);margin-bottom:14px}
  .note b{color:var(--txt)}

  /* barra de abas centralizada: em vez de uma fita que rola pro lado (e esconde
     metade das abas), as abas quebram em linhas e ficam centradas no papel. */
  .tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding-bottom:10px;margin-bottom:18px;border-bottom:1px solid #1e293b}

  /* ---- Navegação do mestre: grupos, trilha, progresso, busca ---- */
  .grupos{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:10px}
  .grupo-b{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:120px;
           border:1px solid var(--line);background:rgba(15,23,41,.5);color:var(--muted);
           border-radius:12px;padding:8px 14px;font-weight:700;font-size:13px;transition:.15s}
  .grupo-b:hover{border-color:#475569;color:#fff}
  .grupo-b.on{background:var(--indigo2);border-color:var(--indigo);color:#fff}
  .grupo-b small{font-size:10px;font-weight:500;opacity:.75}
  .subtabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding-bottom:10px;
           margin-bottom:16px;border-bottom:1px solid #1e293b}
  .tab-n{display:inline-block;margin-left:6px;font-size:10px;font-weight:800;background:rgba(148,163,184,.25);
         color:#cbd5e1;border-radius:99px;padding:1px 6px;vertical-align:middle}
  .tab.on .tab-n{background:rgba(255,255,255,.25);color:#fff}
  .tab-alerta{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--rose);
              margin-left:6px;vertical-align:middle;box-shadow:0 0 0 2px rgba(225,29,72,.25)}
  .tab-adv{opacity:.85}
  .tab-adv::before{content:'◇ ';color:#a5b4fc;font-size:10px}

  .crumb{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--dim);margin-bottom:10px}
  .crumb b{color:#c7d2fe;font-weight:700}
  .crumb .sep{opacity:.5}
  .crumb button{background:transparent;color:var(--muted);font-size:12px;padding:0;text-decoration:underline dotted}
  .crumb button:hover{color:#fff}

  .prog-sis{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .prog-sis .t-b{flex:1;height:8px;border-radius:99px;background:#1e293b;overflow:hidden}
  .prog-sis .t-f{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--indigo),var(--emerald));transition:width .25s}
  .prog-sis .t-x{font-size:11px;color:var(--muted);white-space:nowrap}

  .chk-l{display:flex;align-items:flex-start;gap:9px;width:100%;text-align:left;padding:8px 10px;
         border-radius:10px;background:rgba(15,23,41,.5);border:1px solid var(--line);margin-bottom:6px;
         color:var(--txt);font-size:13px;transition:.15s}
  .chk-l:hover{border-color:var(--indigo)}
  .chk-l .mk{font-size:14px;line-height:1.3}
  .chk-l.ok{opacity:.6}
  .chk-l.ok .mk{color:var(--emerald)}
  .chk-l .sub{display:block;font-size:11px;color:var(--muted);margin-top:1px}

  .prox{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
        margin-top:6px;padding-top:12px;border-top:1px solid #1e293b}

  .busca-bg{position:fixed;inset:0;background:rgba(2,6,20,.72);z-index:60;display:flex;
            justify-content:center;align-items:flex-start;padding:70px 16px}
  .busca-cx{width:100%;max-width:560px;background:var(--panel);border:1px solid var(--indigo);
            border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.6);overflow:hidden}
  .busca-cx .in{margin:0;border:none;border-bottom:1px solid var(--line);border-radius:0;font-size:15px;padding:13px 15px}
  .busca-l{max-height:min(58vh,420px);overflow:auto;padding:6px}
  .busca-i{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;
           background:transparent;color:var(--txt);border-radius:9px;padding:9px 11px;font-size:13px}
  .busca-i:hover,.busca-i.foco{background:rgba(99,102,241,.18)}
  .busca-i .ond{font-size:11px;color:var(--dim);white-space:nowrap}
  .busca-vazio{padding:18px;text-align:center;font-size:13px;color:var(--muted)}

  /* ---- Ajuda: botão "?" e glossário ---- */
  .aj{display:inline-grid;place-items:center;width:16px;height:16px;margin-left:6px;padding:0;
      border-radius:50%;background:rgba(99,102,241,.22);border:1px solid rgba(99,102,241,.5);
      color:#c7d2fe;font-size:10px;font-weight:800;line-height:1;vertical-align:middle;transition:.15s}
  .aj:hover{background:var(--indigo2);color:#fff;border-color:#fff}
  .gl-cx{width:100%;max-width:620px;background:var(--panel);border:1px solid var(--indigo);border-radius:14px;
         box-shadow:0 20px 60px rgba(0,0,0,.6);overflow:hidden;display:flex;flex-direction:column;max-height:min(80vh,680px)}
  .gl-top{display:flex;justify-content:space-between;align-items:center;gap:10px;
          padding:12px 15px;border-bottom:1px solid var(--line)}
  .gl-top h3{margin:0;font-size:15px;color:#c7d2fe}
  .gl-body{overflow:auto;padding:14px 15px}
  .gl-t{font-weight:800;font-size:14px;color:#e2e8f0}
  .gl-d{font-size:13px;color:var(--muted);line-height:1.5;margin-top:3px}
  .gl-ex{font-size:12px;color:#a5b4fc;background:rgba(99,102,241,.08);border-left:3px solid var(--indigo);
         border-radius:0 8px 8px 0;padding:6px 10px;margin-top:6px}
  .gl-i{padding:10px 0;border-bottom:1px solid rgba(42,51,80,.5)}
  .gl-i:last-child{border-bottom:none}
  .gl-cat{font-size:11px;font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 2px}
  .gl-cat:first-child{margin-top:0}

  /* ---- Campo de fórmula: realce, autocomplete, prévia e construtor ---- */
  .fx{margin-top:4px}
  .fx-box{position:relative}
  /* espelho atrás do input: mesma fonte, mesmo padding, mesma borda (transparente) */
  .fx-hl,.fx-in{font-family:ui-monospace,Consolas,monospace;font-size:14px;line-height:20px;
                padding:9px 11px;border:1px solid transparent;border-radius:10px;width:100%;
                white-space:pre;overflow:hidden}
  .fx-hl{position:absolute;inset:0;pointer-events:none;color:var(--txt);z-index:0}
  .fx-in{position:relative;z-index:1;background:#0f1729;border-color:var(--line);color:transparent;
         caret-color:#e2e8f0;outline:none;overflow-x:auto}
  .fx-in:focus{border-color:var(--indigo)}
  .fx-in.ruim{border-color:var(--rose)}
  .fx-v{color:#7dd3fc}      /* variável   */
  .fx-f{color:#c4b5fd}      /* função     */
  .fx-n{color:#fbbf24}      /* número     */
  .fx-o{color:#94a3b8}      /* operador   */
  .fx-x{color:#fb7185;text-decoration:underline wavy #fb7185}  /* desconhecido */

  .fx-sug{position:absolute;left:0;right:0;top:calc(100% + 3px);z-index:20;background:var(--panel);
          border:1px solid var(--indigo);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.5);
          max-height:190px;overflow:auto;padding:4px}
  .fx-sug button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;
                 background:transparent;color:var(--txt);font-size:13px;padding:6px 9px;border-radius:7px}
  .fx-sug button:hover,.fx-sug button.foco{background:rgba(99,102,241,.22)}
  .fx-sug .tp{font-size:10px;color:var(--dim)}

  .fx-bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}
  .fx-prev{display:flex;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
  .fx-pt{background:rgba(15,23,41,.7);border:1px solid var(--line);border-radius:8px;padding:2px 8px}
  .fx-pt b{color:#34d399;font-weight:800}
  .fx-err{font-size:12px;color:#fda4af;margin-top:5px;line-height:1.45}
  .fx-err button{background:rgba(225,29,72,.2);border:1px solid rgba(225,29,72,.5);color:#fecdd3;
                 border-radius:7px;padding:1px 7px;font-size:11px;font-weight:700;margin-left:4px}
  .fx-err button:hover{background:var(--rose);color:#fff}

  .fx-mont{margin-top:8px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:10px}
  .fx-grp{font-size:10px;font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin:8px 0 4px}
  .fx-grp:first-child{margin-top:0}
  .fx-chips{display:flex;gap:5px;flex-wrap:wrap}
  .fx-chip{font-size:12px;font-family:ui-monospace,Consolas,monospace;border:1px solid var(--line);
           background:rgba(15,23,41,.6);color:#7dd3fc;border-radius:8px;padding:4px 9px;transition:.15s}
  .fx-chip:hover{border-color:var(--indigo);background:rgba(99,102,241,.16);color:#fff}
  .fx-chip.op{color:#94a3b8}
  .fx-chip.fn{color:#c4b5fd}
  .fx-chip.pr{color:#e2e8f0;font-family:inherit;font-size:11.5px}
  .fx-chip.pr small{display:block;color:var(--dim);font-family:ui-monospace,Consolas,monospace;font-size:10px}
  .tab{white-space:nowrap;background:transparent;color:var(--muted);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;transition:.15s}
  .tab.on{background:var(--indigo2);color:#fff}
  .tab:hover:not(.on){color:#fff;background:#1e293b}

  .card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  .card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
  .card h3{margin:0;font-size:15px;color:#c7d2fe}
  .hint{font-size:12px;color:var(--muted);margin-top:3px}

  label.f{display:block}
  label.f > span{font-size:12px;color:var(--muted)}
  .in{width:100%;background:#0f1729;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:14px;color:var(--txt);outline:none;margin-top:4px}
  .in:focus{border-color:var(--indigo)}
  .mono{font-family:ui-monospace,Consolas,monospace}
  .grid{display:grid;gap:12px}
  .g2{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:1fr 1fr 1fr}
  @media(max-width:560px){.g3{grid-template-columns:1fr 1fr}}

  .btn{border-radius:10px;padding:9px 12px;font-size:14px;font-weight:600;background:#334155;color:#fff;transition:.15s}
  .btn:hover{filter:brightness(1.12)}
  .btn.primary{background:var(--indigo2)}
  .btn.emerald{background:var(--emerald);color:#04231a}
  .btn.amber{background:var(--amber)}
  .btn.danger{background:#9f1239}
  .btn.ghost{background:transparent;border:1px solid var(--line)}
  .btn.sm{padding:5px 9px;font-size:12px}
  .btn.mini{padding:6px 0;width:38px;text-align:center}
  .btn[disabled]{opacity:.4;cursor:not-allowed}

  .row{display:flex;gap:8px;align-items:center}
  .between{justify-content:space-between}
  .wrapf{flex-wrap:wrap}

  .item{background:rgba(15,23,41,.6);border:1px solid var(--line);border-radius:12px;padding:12px}
  .badge{padding:6px 10px;border-radius:9px;font-size:13px;font-weight:700}
  .badge.ok{background:var(--emerald);color:#04231a}
  .badge.warn{background:var(--amber);color:#3b1d00}

  /* Acordeão de classes/raças */
  .acc{border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden;background:rgba(15,23,41,.4)}
  .acc-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;transition:.15s}
  .acc-head:hover{background:rgba(99,102,241,.08)}
  .acc-caret{color:var(--indigo);font-size:12px;width:14px}
  .acc-title{font-weight:700;font-size:15px}
  .acc-meta{font-size:11px;color:var(--dim)}
  .acc-body{padding:0 14px 14px;border-top:1px solid var(--line)}
  .sub-h{font-size:12px;font-weight:700;color:var(--sheet-accent,#c7d2fe);text-transform:uppercase;letter-spacing:.5px;margin:16px 0 8px}
  .sub-h2{font-size:11px;font-weight:700;color:var(--muted);margin:10px 0 6px}

  .ability-card{border:1px solid var(--line);border-left:3px solid var(--indigo);border-radius:0 10px 10px 0;padding:10px 12px;margin-bottom:10px;background:rgba(99,102,241,.05)}
  .req-box{border:1px dashed var(--line);border-radius:10px;padding:8px 10px;margin-top:8px;background:rgba(217,119,6,.05)}
  .req-box .lbl{font-size:11px;color:#fbbf24;font-weight:700;margin-bottom:6px}
  .trait-row{display:flex;gap:8px;margin-bottom:6px}

  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .tg-req{font-size:11px;background:rgba(217,119,6,.15);border:1px solid rgba(217,119,6,.4);color:#fbbf24;border-radius:99px;padding:3px 9px}
  .tg-fx{font-size:11px;background:rgba(99,102,241,.15);border:1px solid rgba(99,102,241,.4);color:#c7d2fe;border-radius:99px;padding:3px 9px}

  .selectable{width:100%;text-align:left;border-radius:12px;border:1px solid var(--line);padding:12px;background:rgba(15,23,41,.5);color:var(--txt);transition:.15s;display:block}
  .selectable:hover{border-color:#475569}
  .selectable.sel-i{border-color:var(--indigo);background:rgba(99,102,241,.12)}
  .selectable.sel-e{border-color:var(--emerald);background:rgba(16,185,129,.12)}
  .selectable .t{font-weight:700}
  .selectable .d{font-size:12px;color:var(--muted)}
  .selectable .fx{font-size:11px;color:#a5b4fc;margin-top:4px}
  .selectable .tr{font-size:11px;color:#6ee7b7;margin-top:2px}

  .skillgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}

  .dots{display:flex;align-items:center;gap:8px;margin-bottom:18px;flex-wrap:wrap}
  .dot{height:28px;width:28px;display:grid;place-items:center;border-radius:50%;font-size:12px;font-weight:800;background:#334155}
  .dot.done{background:var(--emerald);color:#04231a}
  .dot.cur{background:var(--indigo2)}
  .dotlbl{font-size:12px;color:var(--dim)}
  .dotlbl.cur{color:#c7d2fe}
  .dotline{width:18px;height:1px;background:var(--line)}

  .attrrow{display:flex;align-items:center;justify-content:space-between;background:rgba(15,23,41,.5);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:8px}
  .attrval{width:34px;text-align:center;font-size:19px;font-weight:800}
  .attrmod{font-size:12px;color:#a5b4fc;margin-left:8px}

  .statgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
  @media(max-width:560px){.statgrid{grid-template-columns:repeat(3,1fr)}}
  .stat{border-radius:12px;background:rgba(15,23,41,.6);border:1px solid var(--line);padding:8px;text-align:center}
  .stat .n{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stat .v{font-size:20px;font-weight:800}
  .stat .b{font-size:10px;color:#34d399}

  .bar-t{height:12px;border-radius:99px;background:#1e293b;overflow:hidden}
  .bar-f{height:100%;border-radius:99px;transition:width .2s}

  .skl{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:9px;background:rgba(15,23,41,.5);border:1px solid var(--line);margin-bottom:6px}
  .skl .nm{font-size:13px}
  .skl .tg{font-size:10px;color:var(--dim);margin-left:6px}
  .skl .vl{font-weight:800;color:#c7d2fe}

  .abil{border-left:3px solid var(--indigo);padding:6px 10px;background:rgba(99,102,241,.06);border-radius:0 8px 8px 0;margin-bottom:8px}
  .abil.locked{border-left-color:#64748b;background:rgba(100,116,139,.08);opacity:.75}
  .abil .t{font-weight:700;font-size:14px}
  .abil .d{font-size:12px;color:var(--muted)}
  .abil .fx{font-size:11px;color:#a5b4fc;margin-top:2px}
  .abil .lk{font-size:11px;color:#fbbf24;margin-top:2px}
  .trait{border-left:3px solid var(--emerald);padding:6px 10px;background:rgba(16,185,129,.06);border-radius:0 8px 8px 0;margin-bottom:8px}
  .trait .t{font-weight:700;font-size:14px}
  .trait .d{font-size:12px;color:var(--muted)}

  .sheet-top{display:flex;gap:14px;align-items:center;margin-bottom:14px}
  .avatar{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#4f46e5,#0ea5e9);display:grid;place-items:center;font-size:26px;font-weight:900;color:#fff;flex:0 0 auto}
  .sheet-name{font-size:20px;font-weight:800;line-height:1.1}
  .sheet-sub{font-size:12px;color:var(--muted);margin-top:2px}

  .pill{font-size:12px;background:rgba(99,102,241,.15);border:1px solid rgba(99,102,241,.4);color:#c7d2fe;border-radius:99px;padding:4px 12px}

  .diceres{margin-top:12px;border-radius:12px;background:rgba(15,23,41,.6);border:1px solid var(--line);padding:12px}
  .diceres .big{font-size:30px;font-weight:900;color:#fbbf24}
  .diceres .sub{font-size:12px;color:var(--muted)}

  /* ---- Editor de layout em canvas (posição livre) ---- */
  .cv-fit{overflow:hidden;position:relative;width:100%}
  .cv{position:relative;transform-origin:0 0;background:#0b1020;border-radius:14px}
  .cv.edit{border:1px solid var(--line)}
  /* a grade agora é opcional e tem tamanho configurável (--g) */
  .cv.edit.com-grade{background-image:linear-gradient(rgba(99,102,241,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(99,102,241,.09) 1px,transparent 1px);background-size:var(--g,20px) var(--g,20px)}
  .blk{position:absolute;overflow:hidden;border-radius:12px}
  .blk.framed{background:rgba(15,23,41,.55);border:1px solid var(--line);padding:10px}
  .blk-body{height:100%;overflow:auto}
  .cv.edit .blk{cursor:grab;touch-action:none;outline:1px dashed rgba(148,163,184,.3)}
  .cv.edit .blk-body{pointer-events:none;overflow:hidden}
  .cv.edit .blk.sel{outline:2px solid var(--indigo);box-shadow:0 0 0 4px rgba(99,102,241,.18)}
  .cv.edit .blk.dragging{cursor:grabbing;opacity:.92}
  .blk-rs{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;touch-action:none;background:linear-gradient(135deg,transparent 46%,var(--indigo) 46%);border-radius:0 0 12px 0}
  .blk-tt{font-size:11px;font-weight:700;color:var(--sheet-accent,#c7d2fe);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
  /* a etiqueta de tipo cobriria o conteúdo do bloco: só aparece no hover ou no selecionado */

<body>
<div id="root"></div>

<script>
/* ============================================================ HELPERS ============================================================ */
function h(tag, attrs){
  const e = document.createElement(tag);
  if(attrs) for(const k in attrs){
    const v = attrs[k];
    if(v==null || v===false) continue;
    if(k==='class') e.className = v;
    else if(k==='html') e.innerHTML = v;
    else if(k==='value') e.value = v;
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2).toLowerCase(), v);
    else if(k==='style' && typeof v==='object') Object.assign(e.style, v);
    else e.setAttribute(k, v===true?'':v);
  }
  for(let i=2;i<arguments.length;i++){
    let kid = arguments[i];
    if(kid==null) continue;
    if(Array.isArray(kid)){ kid.forEach(k2=>{ if(k2!=null) e.appendChild(node(k2)); }); }
    else e.appendChild(node(kid));
  }
  return e;
}
function node(x){ return (typeof x==='string'||typeof x==='number') ? document.createTextNode(x) : x; }
const uid = ()=>Math.random().toString(36).slice(2,9);
const load = k=>{ try{return JSON.parse(localStorage.getItem(k));}catch{return null;} };
const store = (k,v)=>localStorage.setItem(k,JSON.stringify(v));
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function sign(n){ return (n>=0?'+':'')+n; }

/* ============================================================ MOTOR DE FÓRMULAS ============================================================
   Aceita: números, variáveis (inclusive com espaço e acento), + - * / %,
   parênteses, comparações, "e"/"ou", e funções.
   As variáveis são resolvidas no tokenizador, casando o nome MAIS LONGO e
   exigindo fronteira de palavra — trocar texto por regex quebraria max()
   se algum atributo se chamasse "Ma". */
const FORM_FN={
  min:(...a)=>Math.min(...a), max:(...a)=>Math.max(...a),
  menor:(...a)=>Math.min(...a), maior:(...a)=>Math.max(...a),
  arredondar:(x)=>Math.round(x), round:(x)=>Math.round(x),
  piso:(x)=>Math.floor(x), floor:(x)=>Math.floor(x),
  teto:(x)=>Math.ceil(x), ceil:(x)=>Math.ceil(x),
  abs:(x)=>Math.abs(x), modulo:(a,b)=>b===0?0:a%b,
  se:(c,a,b)=>c?a:(b===undefined?0:b), if:(c,a,b)=>c?a:(b===undefined?0:b),
};
const FORM_FN_NOMES=Object.keys(FORM_FN);
const ehLetra=c=>/[a-zA-Z0-9_@.À-ÿ]/.test(c);
function tokenize(str, nomesVars){
  const t=[]; let i=0;
  const s=String(str==null?'':str);
  while(i<s.length){
    const c=s[i];
    if(c===' '||c==='\t'||c==='\n'){ i++; continue; }
    if(/[0-9]/.test(c) || (c==='.'&&/[0-9]/.test(s[i+1]||''))){
      let n=''; while(i<s.length&&/[0-9.]/.test(s[i])) n+=s[i++];
      t.push({t:'n',v:parseFloat(n)}); continue;
    }
    const dois=s.slice(i,i+2);
    if(['>=','<=','==','!=','&&','||'].includes(dois)){ t.push({t:'o',v:dois}); i+=2; continue; }
    if('+-*/%(),<>!'.includes(c)){ t.push({t:'o',v:c}); i++; continue; }
    if(ehLetra(c)){
      /* Função vence variável quando vier seguida de "(" — senão um atributo
         chamado "Se" ou "Max" impediria de usar se() / max(). */
      let fn=null;
      for(const nome of FORM_FN_NOMES){
        if(s.substr(i,nome.length).toLowerCase()===nome && !ehLetra(s[i+nome.length]||'')){
          let j=i+nome.length; while(j<s.length&&s[j]===' ') j++;
          if(s[j]==='('){ fn=nome; break; }
        }
      }
      if(fn){ t.push({t:'w',v:fn}); i+=fn.length; continue; }
      /* tenta casar um nome de variável (a lista já vem do mais longo p/ o mais curto) */
      let casou=null;
      for(const n of nomesVars){
        if(!n) continue;
        if(s.substr(i,n.length).toLowerCase()===n.toLowerCase()){
          const depois=s[i+n.length];
          const antes=s[i-1];
          if((!depois||!ehLetra(depois)) && (!antes||!ehLetra(antes))){ casou=n; break; }
        }
      }
      if(casou){ t.push({t:'v',v:casou}); i+=casou.length; continue; }
      let w=''; while(i<s.length&&ehLetra(s[i])) w+=s[i++];
      t.push({t:'w',v:w.toLowerCase()}); continue;
    }
    throw 0;
  }
  return t;
}
function parseTokens(t, vars){
  let p=0;
  const fim=()=>p>=t.length;
  const ehOp=v=>{ const k=t[p]; return !!k&&k.t==='o'&&k.v===v; };
  const ehPal=v=>{ const k=t[p]; return !!k&&k.t==='w'&&k.v===v; };
  function expr(){ return ouE(); }
  function ouE(){ let a=eE(); while(ehOp('||')||ehPal('ou')){ p++; const b=eE(); a=(a||b)?1:0; } return a; }
  function eE(){ let a=cmp(); while(ehOp('&&')||ehPal('e')){ p++; const b=cmp(); a=(a&&b)?1:0; } return a; }
  function cmp(){
    let a=add(); const k=t[p];
    if(k&&k.t==='o'&&['>','<','>=','<=','==','!='].includes(k.v)){
      p++; const b=add();
      return k.v==='>'?(a>b?1:0):k.v==='<'?(a<b?1:0):k.v==='>='?(a>=b?1:0):
             k.v==='<='?(a<=b?1:0):k.v==='=='?(a===b?1:0):(a!==b?1:0);
    }
    return a;
  }
  function add(){ let a=mul(); while(ehOp('+')||ehOp('-')){ const o=t[p++].v; const b=mul(); a=(o==='+')?a+b:a-b; } return a; }
  function mul(){ let a=un(); while(ehOp('*')||ehOp('/')||ehOp('%')){ const o=t[p++].v; const b=un();
    a = o==='*' ? a*b : (b===0?0:(o==='/'?a/b:a%b)); } return a; }
  function un(){ if(ehOp('-')){ p++; return -un(); } if(ehOp('+')){ p++; return un(); } if(ehOp('!')){ p++; return un()?0:1; } return prim(); }
  function prim(){
    if(fim()) throw 0;
    const k=t[p++];
    if(k.t==='n') return k.v;
    if(k.t==='v') return Number(vars[k.v])||0;
    if(k.t==='w'){
      const f=FORM_FN[k.v];
      if(!f || !ehOp('(')) throw 0;          /* palavra desconhecida = fórmula inválida */
      p++;
      const args=[];
      if(!ehOp(')')){ args.push(expr()); while(ehOp(',')){ p++; args.push(expr()); } }
      if(!ehOp(')')) throw 0; p++;
      return f(...args);
    }
    if(k.t==='o'&&k.v==='('){ const v=expr(); if(!ehOp(')')) throw 0; p++; return v; }
    throw 0;
  }
  const v=expr();
  if(!fim()) throw 0;
  return v;
}
function evalFormula(f, vars){
  const v=vars||{};
  try{
    const nomes=Object.keys(v).sort((a,b)=>b.length-a.length);
    const r=parseTokens(tokenize(f, nomes), v);
    return Number.isFinite(r)?Math.floor(r):NaN;
  }catch(e){ return NaN; }
}
/* mantido para compatibilidade com fórmulas sem variáveis */
function evalArith(str){ return parseTokens(tokenize(str,[]), {}); }
function effAttr(sys, raw){
  if(sys.attrMode==='modificador'){ const m=evalFormula(sys.modFormula||'(V - 10) / 2',{V:raw}); return Number.isFinite(m)?m:raw; }
  return raw;
}

/* ============================================================ MOTOR DE DADOS ============================================================
   Expressões: 2d6+3 · 4d6kh3 (mantém os 3 maiores) · 2d20kl1 (o menor) ·
   1d8+Força (mistura com o motor de fórmulas).
   Os dados são resolvidos PRIMEIRO e substituídos pela soma; o que sobra vai
   para evalFormula. Assim "1d8 + Força * 2" funciona sem parser novo.

   Dois canais que NÃO se convertem (peça 4 do roadmap):
   - canal NÚMERO: soma/subtrai do total  (+2)
   - canal DADOS:  soma/subtrai dados     (−1d20 do Ordem)
   Todo efeito diz em qual canal mexe. */
function rolarDado(faces){ return 1+Math.floor(Math.random()*faces); }
const DICE_RE=/(\d*)d(\d+)(?:(kh|kl|dh|dl)(\d+))?/gi;
/* Resolve os termos de dado de uma expressão e devolve total + detalhamento. */
function rollExpr(expr, vars, opts){
  opts=opts||{};
  const detalhes=[]; let erro=null;
  const resolvida=String(expr==null?'':expr).replace(DICE_RE,(m,q,f,keep,k)=>{
    let qtd=Math.max(1,parseInt(q||'1')||1);
    const faces=Math.max(2,parseInt(f)||2);
    /* CRÍTICO: multiplica só a QUANTIDADE DE DADOS, nunca o modificador fixo. */
    if(opts.crit) qtd=qtd*Math.max(1,opts.critMult||2);
    if(qtd>300||faces>1000){ erro='Dados demais ('+m+')'; return '0'; }
    const rolls=Array.from({length:qtd},()=>rolarDado(faces));
    let usados=rolls;
    if(keep){
      const kn=Math.max(1,Math.min(qtd,parseInt(k)||1));
      const ord=rolls.slice().sort((a,b)=>a-b);
      usados = keep==='kh'?ord.slice(-kn) : keep==='kl'?ord.slice(0,kn)
             : keep==='dh'?ord.slice(0,Math.max(0,qtd-kn)) : ord.slice(kn);
    }
    const soma=usados.reduce((s,n)=>s+n,0);
    detalhes.push({termo:m,faces,rolls,usados:usados.slice(),soma});
    return '('+soma+')';
  });
  if(erro) return {erro};
  const total=evalFormula(resolvida, vars||{});
  if(Number.isNaN(total)) return {erro:'Expressão inválida'};
  return {total, detalhes, expr:String(expr==null?'':expr), resolvida, crit:!!opts.crit};
}
/* Vantagem/desvantagem: 2 dados com álgebra própria — NÃO somam e SE CANCELAM.
   vd > 0 vantagem, vd < 0 desvantagem, 0 normal. */
function aplicarVD(expr, vd){
  if(!vd) return String(expr==null?'':expr);
  let feito=false;
  return String(expr==null?'':expr).replace(DICE_RE,(m,q,f,keep)=>{
    if(feito||keep) return m;           /* só o primeiro termo, e não mexe em kh/kl já escrito */
    feito=true;
    const qtd=Math.max(1,parseInt(q||'1')||1);
    return (qtd+1)+'d'+f+(vd>0?'kh':'kl')+qtd;
  });
}
/* Dice pool do Ordem: "melhor de (atributo)d20"; atributo 0 → 2d20 pega o PIOR. */
function poolExpr(qtd, faces){
  const n=Math.floor(qtd||0);
  faces=faces||20;
  return n<=0 ? ('2d'+faces+'kl1') : (n+'d'+faces+'kh1');
}
/* Aplica o canal de DADOS a uma expressão: soma/subtrai a quantidade do 1º termo.
   Se sobrar 0 ou menos dados, vira pool "pega o pior" (regra do Ordem). */
function aplicarModDados(expr, nd){
  if(!nd) return String(expr==null?'':expr);
  let feito=false;
  return String(expr==null?'':expr).replace(DICE_RE,(m,q,f,keep,k)=>{
    if(feito) return m; feito=true;
    const qtd=Math.max(1,parseInt(q||'1')||1);
    const novo=qtd+nd;
    if(novo<=0) return '2d'+f+'kl1';
    return novo+'d'+f+(keep?(keep+k):'');
  });
}
function textoRolagem(res){
  if(!res||res.erro) return res&&res.erro?('⚠ '+res.erro):'—';
  return (res.detalhes||[]).map(d=>{
    const descartados=d.rolls.length!==d.usados.length;
    return d.termo+' ['+d.rolls.join(', ')+']'+(descartados?(' → '+d.usados.join('+')):'');
  }).join('  ');
}

/* ============================================================ SISTEMA DE EXEMPLO ============================================================ */
const SCHEMA = 10;
const THEME_PRESETS = ['Combate','Investigação','Terror','Mistério','Fantasia','Ficção Científica','Sobrevivência','Aventura','Drama','Ação'];

/* Largura fixa do "papel" da ficha. Os blocos guardam x/y/w/h nessa escala;
   na hora de exibir, o canvas inteiro é escalado para caber na tela. */
const CANVAS_W = 860;
const GRID = 10;

/* label = nome na paleta do mestre; title = título impresso na ficha */
const BLOCK_TYPES = {
  nome:           {label:'Nome & Identidade',      title:'Identidade',   icon:'🪪', multi:false, w:660, h:90},
  foto:           {label:'Foto do Personagem',     title:'Foto',         icon:'🖼️', multi:false, w:170, h:190},
  atributos:      {label:'Atributos',              title:'Atributos',    icon:'💪', multi:false, w:660, h:90},
  valores:        {label:'Valores (Defesa etc.)',  title:'Valores',      icon:'🛡️', multi:false, w:410, h:110},

/* ---- Migração / saneamento ----
   Nunca descartar o sistema do usuário por mudança de versão: converter.
   Também garante que listas essenciais existam, para que render() não morra. */
/* ---- Progressão: tabela de degraus com colunas livres ----
   Cada coluna vira uma variável usável nas fórmulas do sistema. O eixo continua
   sendo um número (1..maxLevel), mas o mestre pode dar rótulo a cada degrau —
   é assim que "NEX 5% … 99%" cabe sem o motor saber o que é NEX. */
function emptyProg(){ return {cols:[], rows:{}, labels:{}}; }
function sanitizeProg(p){
  if(!p || typeof p!=='object') return emptyProg();
  if(!Array.isArray(p.cols)) p.cols=[];
  if(!p.rows || typeof p.rows!=='object') p.rows={};
  if(!p.labels || typeof p.labels!=='object') p.labels={};
  p.cols.forEach(c=>{ if(!c.id) c.id=uid(); if(!c.tipo) c.tipo='num'; if(typeof c.name!=='string') c.name='Coluna'; });
  return p;
}
function sanitizeSystem(sys){
  if(!sys || typeof sys!=='object' || Array.isArray(sys)) return null;
  ['attributes','resources','skills','classes','origins','themes','items',
   'choices','profTiers','conditions','tags','tagMatrix','techTiers','slots'].forEach(k=>{ if(!Array.isArray(sys[k])) sys[k]=[]; });
  if(typeof sys.cargaFormula!=='string') sys.cargaFormula='';
  /* --- peça 2: multiplicador de proficiência --- */
  if(!['nenhum','bonus','mult'].includes(sys.profMode)) sys.profMode='nenhum';
  if(typeof sys.profFormula!=='string') sys.profFormula='';
  sys.profTiers.forEach(t=>{
    if(!t.id) t.id=uid();
    if(typeof t.name!=='string') t.name='Grau';
    if(typeof t.mult!=='number'||Number.isNaN(t.mult)) t.mult=0;
    if(typeof t.bonus!=='number'||Number.isNaN(t.bonus)) t.bonus=0;
  });
  /* --- peça 1: pontos de escolha --- */
  sys.choices.forEach(c=>{
    if(!c.id) c.id=uid();
    if(typeof c.name!=='string') c.name='Escolha';
    if(typeof c.hint!=='string') c.hint='';
    if(typeof c.level!=='number'||Number.isNaN(c.level)) c.level=1;
    if(typeof c.count!=='number'||Number.isNaN(c.count)) c.count=1;
    if(typeof c.repetivel!=='boolean') c.repetivel=false;
    if(!Array.isArray(c.options)) c.options=[];
    c.options.forEach(o=>{
      if(!o.id) o.id=uid();
      if(typeof o.name!=='string') o.name='Opção';
      if(typeof o.description!=='string') o.description='';
      if(!o.req||typeof o.req!=='object') o.req={level:0,attrs:[]};
      if(typeof o.req.level!=='number') o.req.level=0;
      if(!Array.isArray(o.req.attrs)) o.req.attrs=[];
      if(!Array.isArray(o.req.choices)) o.req.choices=[];   /* exige outra opção escolhida */
      if(!Array.isArray(o.effects)) o.effects=[];
    });
  });
  /* --- peça 5: condições / estados --- */
  sys.conditions.forEach(c=>{
    if(!c.id) c.id=uid();
    if(typeof c.name!=='string') c.name='Condição';
    if(typeof c.icon!=='string') c.icon='⚠';
    if(typeof c.color!=='string') c.color='#e11d48';
    if(typeof c.description!=='string') c.description='';
    if(typeof c.noStack!=='boolean') c.noStack=true;
    if(typeof c.niveis!=='number'||Number.isNaN(c.niveis)) c.niveis=0;  /* 0 = sem trilha de níveis */
    if(!Array.isArray(c.componentes)) c.componentes=[];   /* composição: Fatigado = fraco + vulnerável */
    if(!Array.isArray(c.effects)) c.effects=[];
  });
  /* --- peça 7: tags e matriz de interação --- */
  sys.tags.forEach(t=>{
    if(!t.id) t.id=uid();
    if(typeof t.name!=='string') t.name='Tag';
    if(typeof t.color!=='string') t.color='#6366f1';
  });
  sys.tagMatrix.forEach(m=>{
    if(!m.id) m.id=uid();
    if(typeof m.mult!=='number'||Number.isNaN(m.mult)) m.mult=1;
    if(typeof m.dice!=='number'||Number.isNaN(m.dice)) m.dice=0;
    if(typeof m.nota!=='string') m.nota='';
  });
  /* --- peça 8: orçamento de técnica por tier --- */
  sys.techTiers.forEach(t=>{
    if(!t.id) t.id=uid();
    if(typeof t.name!=='string') t.name='Tier';
    if(typeof t.tier!=='number'||Number.isNaN(t.tier)) t.tier=0;
    if(typeof t.danoMax!=='string') t.danoMax='';
    if(typeof t.custoFormula!=='string') t.custoFormula='';
    if(typeof t.reqLevel!=='number'||Number.isNaN(t.reqLevel)) t.reqLevel=0;
  });
  if(typeof sys.techAtivo!=='boolean') sys.techAtivo=false;
  if(typeof sys.techNome!=='string') sys.techNome='Técnicas';
  if(typeof sys.techRecursoId!=='string') sys.techRecursoId='';
  if(typeof sys.techCustoAcaoComplexa!=='number') sys.techCustoAcaoComplexa=2;
  if(typeof sys.techCustoAcaoSimples!=='number') sys.techCustoAcaoSimples=1;
  if(typeof sys.techCustoExtra!=='number') sys.techCustoExtra=1;
  /* --- peça 6: slots e sintonização --- */
  sys.slots.forEach(s=>{
    if(!s.id) s.id=uid();
    if(typeof s.name!=='string') s.name='Slot';
    if(typeof s.max!=='number'||Number.isNaN(s.max)) s.max=1;
  });
  if(typeof sys.sintoniaMax!=='number'||Number.isNaN(sys.sintoniaMax)) sys.sintoniaMax=0;  /* 0 = sem sintonização */
  /* --- peça 3: como o sistema rola. O motor NÃO sabe o nome de nenhum sistema
     (Regra #25): "1d20 + bônus" e "pool de d20" são só configurações. --- */
  if(!['soma','pool'].includes(sys.rollMode)) sys.rollMode='soma';
  if(typeof sys.rollBase!=='string'||!sys.rollBase.trim()) sys.rollBase='1d20';
  if(typeof sys.poolFaces!=='number'||Number.isNaN(sys.poolFaces)) sys.poolFaces=20;
  if(typeof sys.critNat!=='number'||Number.isNaN(sys.critNat)) sys.critNat=20;
  if(typeof sys.critSoDados!=='boolean') sys.critSoDados=true;
  sys.items.forEach(it=>{
    if(!it.id) it.id=uid();
    if(typeof it.name!=='string') it.name='Item';
    if(typeof it.description!=='string') it.description='';
    if(!ITEM_CATS.some(c=>c[0]===it.categoria)) it.categoria='outro';
    if(typeof it.weight!=='number'||Number.isNaN(it.weight)) it.weight=0;
    if(typeof it.equipavel!=='boolean') it.equipavel=true;
    if(!Array.isArray(it.effects)) it.effects=[];
    if(typeof it.slotId!=='string') it.slotId='';
    if(typeof it.empilhavel!=='boolean') it.empilhavel=false;
    if(typeof it.sintonia!=='boolean') it.sintonia=false;
    /* ataque estruturado (arma) */
    if(!it.attack||typeof it.attack!=='object') it.attack={on:false};
    const at=it.attack;
    if(typeof at.on!=='boolean') at.on=false;
    if(typeof at.attrId!=='string') at.attrId='';
    if(typeof at.skillId!=='string') at.skillId='';
    if(typeof at.dano!=='string') at.dano='1d6';
    if(typeof at.alcance!=='string') at.alcance='';
    if(typeof at.critRange!=='number'||Number.isNaN(at.critRange)) at.critRange=20;
    if(typeof at.critMult!=='number'||Number.isNaN(at.critMult)) at.critMult=2;
    if(!Array.isArray(at.tags)) at.tags=[];
    /* armadura que DEFINE a fórmula (não só soma) */
    if(!it.armor||typeof it.armor!=='object') it.armor={on:false};
    const ar=it.armor;
    if(typeof ar.on!=='boolean') ar.on=false;
    if(typeof ar.resId!=='string') ar.resId='';
    if(typeof ar.formula!=='string') ar.formula='';
    if(typeof ar.maxAttrId!=='string') ar.maxAttrId='';
    if(typeof ar.maxAttrVal!=='number'||Number.isNaN(ar.maxAttrVal)) ar.maxAttrVal=0;
  });
  if(!sys.perLevel || typeof sys.perLevel!=='object') sys.perLevel={attrPoints:0,attrEveryN:0,skillPoints:0,skillEveryN:0};
  if(typeof sys.name!=='string') sys.name='Sistema sem nome';
  if(typeof sys.campaignName!=='string') sys.campaignName='Campanha';
  if(typeof sys.levelName!=='string'||!sys.levelName.trim()) sys.levelName='Nível';
  sys.progression=sanitizeProg(sys.progression);
  sys.classes.forEach(c=>{ c.progression=sanitizeProg(c.progression); });
  sys.resources.forEach(r=>{
    if(!r.recharge||typeof r.recharge!=='object') r.recharge={trig:'nunca',amt:'tudo',formula:''};
    if(typeof r.perRound!=='string') r.perRound='';
  });
  /* aparência do papel (editor reformado) */
  if(sys.sheet&&typeof sys.sheet==='object'){
    const sh=sys.sheet;
    if(typeof sh.bg!=='string') sh.bg='';                 /* vazio = fundo padrão do tema */
    if(typeof sh.bgImage!=='string') sh.bgImage='';
    if(typeof sh.grid!=='number'||Number.isNaN(sh.grid)) sh.grid=GRID;
    if(typeof sh.showGrid!=='boolean') sh.showGrid=true;
    if(typeof sh.snap!=='boolean') sh.snap=true;
    if(!Array.isArray(sh.guides)) sh.guides=[];           /* réguas fixas do mestre */
    sh.guides.forEach(g=>{ if(!g.id) g.id=uid(); if(g.eixo!=='gy') g.eixo='gx'; if(typeof g.pos!=='number') g.pos=0; });
  }
  return sys;
}
/* rótulo de um degrau: o que o mestre escreveu, ou "Nível 3" */
function levelLabel(sys,lv){
  const l=((sys.progression||{}).labels||{})[lv];
  return (l&&String(l).trim()) ? String(l).trim() : ((sys.levelName||'Nível')+' '+lv);
}
/* colunas numéricas do degrau atual viram variáveis; a tabela da classe vence a global */
function progVars(sys,d){
  const out={};
  const juntar=prog=>{
    if(!prog||!Array.isArray(prog.cols)) return;
    const row=(prog.rows||{})[d.level]||{};
    prog.cols.forEach(c=>{
      if(c.tipo!=='num') return;
      const v=row[c.id];
      if(v===undefined||v===''||v===null) return;
      const n=Number(v);
      if(Number.isFinite(n)) out[c.name]=n;
    });
  };
  juntar(sys.progression);
  const cls=(sys.classes||[]).find(c=>c.id===d.classId);
  if(cls) juntar(cls.progression);
  return out;
}
/* tudo do degrau atual (inclusive texto), para exibir na ficha */
function progLinha(sys,d){
  const out=[];
  const juntar=(prog,origem)=>{
    if(!prog||!Array.isArray(prog.cols)) return;
    const row=(prog.rows||{})[d.level]||{};
    prog.cols.forEach(c=>{
      const v=row[c.id];
      if(v===undefined||v===''||v===null) return;
      const i=out.findIndex(x=>x.name===c.name);
      const item={name:c.name, valor:String(v), tipo:c.tipo, origem};
      if(i>=0) out[i]=item; else out.push(item);
    });
  };
  juntar(sys.progression,'sistema');
  const cls=(sys.classes||[]).find(c=>c.id===d.classId);
  if(cls) juntar(cls.progression, cls.name);
  return out;
}
/* v6 usava sheet.sections (lista ordenada com on/off). v7 usa sheet.blocks (x/y/w/h). */
function migrateSheet(sys){
  const old=sys.sheet;
  if(old && Array.isArray(old.blocks)){
    old.blocks.forEach(b=>{
      const antigo=b.opts||{};
      b.opts={...defaultOpts(b.key), ...antigo};
      /* Entrada 004: honeycomb (booleano) virou arranjo (grade|colmeia|flor).
         A checagem usa o objeto ANTES do merge — depois dele o default já
         preencheu "arranjo" e a conversão nunca dispararia. */
      if(antigo.arranjo===undefined && antigo.honeycomb!==undefined){
        b.opts.arranjo=antigo.honeycomb?'colmeia':'grade';
      }
      delete b.opts.honeycomb;
    });
    if(!old.canvasH) old.canvasH=990;
    return;
  }
  const sh=defaultSheet();
  if(old){
    if(old.title) sh.title=old.title;
    if(old.accent) sh.accent=old.accent;
    const byKey=k=>sh.blocks.find(b=>b.key===k);
    if(old.attrCols) byKey('atributos').opts.cols=Math.max(2,Math.min(6,old.attrCols));
    if(old.avatarEmoji) byKey('foto').opts.emoji=old.avatarEmoji;
    if(old.showAvatar===false) sh.blocks=sh.blocks.filter(b=>b.key!=='foto');
    if(Array.isArray(old.sections)){
      const map={stats:['atributos','valores'],recursos:['recursos'],pericias:['pericias'],habilidades:['habilidades'],
                 caracteristicas:['caracteristicas'],anotacoes:['anotacoes'],dados:['dados']};
      const drop=new Set();
      old.sections.filter(s=>!s.on).forEach(s=>(map[s.key]||[]).forEach(k=>drop.add(k)));
      sh.blocks=sh.blocks.filter(b=>!drop.has(b.key));
    }
  }
  sys.sheet=sh;
}
const SCHEMA_MIN=6;   /* versões que sabemos migrar */
function migrateSystem(sys){
  if(!sys || typeof sys!=='object' || Array.isArray(sys)) return null;
  const v=sys.__v;
  /* aceita qualquer versão conhecida (6..atual); versão de fora disso não se arrisca */
  if(typeof v!=='number' || v<SCHEMA_MIN || v>SCHEMA) return null;
  if(!sanitizeSystem(sys)) return null;
  migrateSheet(sys);
  sys.__v=SCHEMA;
  return sys;
}

/* Garante que um rascunho antigo (salvo antes destas peças) tenha os campos novos. */
function sanitizeDraft(d,sys){
  if(!d||typeof d!=='object') return initDraft(sys);
  if(!d.choices||typeof d.choices!=='object') d.choices={};
  if(!d.skillTier||typeof d.skillTier!=='object') d.skillTier={};
  if(!Array.isArray(d.conditions)) d.conditions=[];
  if(!Array.isArray(d.techniques)) d.techniques=[];
  if(!Array.isArray(d.inventory)) d.inventory=[];
  d.inventory.forEach(e=>{
    if(!e.iid) e.iid=uid();
    if(typeof e.qtd!=='number'||Number.isNaN(e.qtd)||e.qtd<1) e.qtd=1;
    if(typeof e.attuned!=='boolean') e.attuned=false;
  });
  d.conditions.forEach(c=>{ if(!c.cid) c.cid=uid(); if(typeof c.nivel!=='number') c.nivel=1; });
  d.techniques.forEach(t=>{ if(!t.id) t.id=uid(); if(!t.campos||typeof t.campos!=='object') t.campos={}; });
  return d;
}

/* progressão por nível */
function levelPoints(sys, level){
  const steps=Math.max(0,(level||sys.startLevel)-sys.startLevel);
  const p=sys.perLevel||{};
  const ax=(p.attrEveryN>0)?Math.floor(steps/p.attrEveryN)*(p.attrPoints||0):0;
  const sx=(p.skillEveryN>0)?Math.floor(steps/p.skillEveryN)*(p.skillPoints||0):0;
  return { attrPoints:(sys.attributePoints||0)+ax, skillCount:(sys.skillChoices||0)+sx };
}
/* ---- Aplicação de efeitos ----
   Um efeito pode ser: bônus de atributo, bônus de recurso, concede perícia,
   característica (etiqueta ou numérica) ou "efeito único" (texto livre que
   carrega uma lista de modificações — o "aumenta Defesa e Vida ao mesmo tempo").
   applyEffectTo despeja o efeito nos baldes; attrOnlyTo extrai só o atributo
   (usado na 1ª passagem que libera requisitos), recursando nos mods. */
const DICE_ESCOPOS=[['todos','Todas as rolagens'],['ataque','Ataques'],['pericia','Testes de perícia'],['defesa','Defesa'],['dano','Dano'],['tecnica','Técnicas']];
function applyEffectTo(ef, B, mult){
  if(!ef) return;
  const k=mult==null?1:mult;               /* trilha de níveis (exaustão) multiplica o valor */
  const v=(+ef.value||0)*k;
  if(ef.kind==='atributo'){ if(ef.targetId) B.attrBonus[ef.targetId]=(B.attrBonus[ef.targetId]||0)+v; }
  else if(ef.kind==='recurso'){ if(ef.targetId) B.resBonus[ef.targetId]=(B.resBonus[ef.targetId]||0)+v; }
  else if(ef.kind==='pericia'){ if(ef.targetId && !B.grantedSkills.includes(ef.targetId)) B.grantedSkills.push(ef.targetId); }
  else if(ef.kind==='caracteristica'){ const nm=(ef.text||'').trim(); if(nm){
    if(ef.charType==='num') B.charNum[nm]=(B.charNum[nm]||0)+v;
    else if(!B.charTags.includes(nm)) B.charTags.push(nm); } }
  /* PEÇA 4 — canal de DADOS. Não se converte em número: some/tire dados. */
  else if(ef.kind==='dados'){ const es=ef.escopo||'todos'; B.diceMod[es]=(B.diceMod[es]||0)+v; }
  else if(ef.kind==='livre'){ (ef.mods||[]).forEach(m=>applyEffectTo(m,B,k)); }
}
/* Quantos dados somar/tirar num escopo (o "todos" sempre entra junto). */
function diceModDe(B, escopo){ return (B.diceMod&&((B.diceMod.todos||0)+(B.diceMod[escopo]||0)))||0; }
function attrOnlyTo(ef, tot1){
  if(!ef) return;
  if(ef.kind==='atributo'){ if(ef.targetId) tot1[ef.targetId]=(tot1[ef.targetId]||0)+(+ef.value||0); }
  else if(ef.kind==='livre'){ (ef.mods||[]).forEach(m=>attrOnlyTo(m,tot1)); }
}
/* efeitos com requisitos (2 passagens p/ liberar habilidades) */
/* Expande as condições ativas: resolve composição (Fatigado = Fraco + Vulnerável),
   com guarda contra ciclo, e aplica a regra de não-empilhamento. */
function expandirCondicoes(sys,d){
  const cat=sys.conditions||[];
  const out=[]; const vistos=new Set();
  const visita=(condId,nivel,raiz,profundidade)=>{
    if(profundidade>8) return;                      /* guarda contra ciclo A→B→A */
    const c=cat.find(x=>x.id===condId); if(!c) return;
    const chave=c.id;
    if(c.noStack!==false && vistos.has(chave)){
      /* já existe: fica com o nível mais alto, não soma duas vezes */
      const ja=out.find(o=>o.cond.id===chave);
      if(ja && nivel>ja.nivel) ja.nivel=nivel;
      return;
    }
    vistos.add(chave);
    out.push({cond:c, nivel:Math.max(1,nivel||1), via:raiz});
    (c.componentes||[]).forEach(id=>visita(id,nivel,c.name,profundidade+1));
  };
  (d.conditions||[]).forEach(e=>visita(e.condId, e.nivel||1, null, 0));
  return out;
}
/* Opções de ponto de escolha efetivamente escolhidas pelo jogador. */
function escolhasAtivas(sys,d){
  const out=[];
  (sys.choices||[]).forEach(ch=>{
    const sel=(d.choices||{})[ch.id]||[];
    sel.forEach(oid=>{ const op=(ch.options||[]).find(o=>o.id===oid); if(op) out.push({ch,op}); });
  });
  return out;
}
function gatherEffects(sys,d){
  const cls=sys.classes.find(c=>c.id===d.classId);
  const org=sys.origins.find(o=>o.id===d.originId);
  const sources=[];
  if(cls)(cls.abilities||[]).forEach(a=>sources.push({ab:a,src:'classe'}));
  if(org)(org.abilities||[]).forEach(a=>sources.push({ab:a,src:'raça'}));
  /* PEÇA 1 — cada opção escolhida entra como uma fonte igual às outras */
  const escolhidas=escolhasAtivas(sys,d);
  escolhidas.forEach(({ch,op})=>sources.push({ab:op,src:ch.name}));
  const level=d.level;
  const isUncond=ab=>{const r=ab.req||{};return (!r.level||r.level<=0)&&(!(r.attrs&&r.attrs.length));};
  /* itens equipados: no inventário E marcados como equipados. Se o sistema usa
     sintonização, item que exige sintonia só vale se estiver sintonizado. */
  const cat=sys.items||[];
  const equipped=[];
  (d.inventory||[]).forEach(entry=>{ const it=cat.find(x=>x.id===entry.itemId); if(!it||!entry.equipped) return;
    if(it.sintonia && (sys.sintoniaMax||0)>0 && !entry.attuned) return;
    equipped.push({it,entry}); });
  /* PEÇA 5 — condições entram como fonte, com o nível multiplicando os valores */
  const condAtivas=expandirCondicoes(sys,d);
  /* 1ª passagem: base + fontes incondicionais + itens equipados alimentam os requisitos */
  const tot1={}; sys.attributes.forEach(a=>tot1[a.id]=(d.attrs[a.id]??0));
  sources.forEach(({ab})=>{ if(isUncond(ab))(ab.effects||[]).forEach(ef=>attrOnlyTo(ef,tot1)); });
  equipped.forEach(({it})=>(it.effects||[]).forEach(ef=>attrOnlyTo(ef,tot1)));
  const reasonsFor=ab=>{ const r=ab.req||{}; const out=[];
    if(r.level&&level<r.level) out.push((sys.levelName||'Nível')+' '+r.level);
    (r.attrs||[]).forEach(rq=>{ if((tot1[rq.attrId]||0)<rq.min){const a=sys.attributes.find(x=>x.id===rq.attrId);out.push((a?a.name:'?')+' '+rq.min+'+');} });
    /* pré-requisito por opção: exige outra opção já escolhida */
    (r.choices||[]).forEach(oid=>{ if(!escolhidas.some(e=>e.op.id===oid)){
      let nome='outra escolha';
      (sys.choices||[]).forEach(c=>(c.options||[]).forEach(o=>{ if(o.id===oid) nome=o.name; }));
      out.push('Requer: '+nome); } });
    return out; };
  const B={attrBonus:{},resBonus:{},grantedSkills:[],charNum:{},charTags:[],diceMod:{}};
  const active=[],locked=[];
  sources.forEach(({ab,src})=>{ const rs=reasonsFor(ab);
    if(rs.length){ locked.push({ab,src,reasons:rs}); return; }
    active.push({ab,src});
    (ab.effects||[]).forEach(ef=>applyEffectTo(ef,B));
  });
  /* itens equipados aplicam efeitos como qualquer outra fonte */
  equipped.forEach(({it})=>(it.effects||[]).forEach(ef=>applyEffectTo(ef,B)));
  /* condições aplicam por último (é o que o mestre liga e desliga na mesa) */
  condAtivas.forEach(({cond,nivel})=>{
    const k=(cond.niveis>0)?Math.max(1,nivel):1;
    (cond.effects||[]).forEach(ef=>applyEffectTo(ef,B,k));
  });
  return {cls,org,active,locked,equipped,escolhidas,condAtivas,
    attrBonus:B.attrBonus,resBonus:B.resBonus,grantedSkills:B.grantedSkills,
    charNum:B.charNum,charTags:B.charTags,diceMod:B.diceMod,B,
    abilities:active.map(x=>x.ab)};
}
/* PEÇA 7 — relação direcional entre tags: multiplicador de dano + modificador de dados.
   Serve tanto para resistência/vulnerabilidade de D&D quanto para o ciclo de
   opressão do Ordem (Sangue▸Conhecimento▸Energia▸Morte▸Sangue). */
function interacaoTags(sys, tagsOrigem, tagsAlvo){
  let mult=1, dice=0; const notas=[];
  (sys.tagMatrix||[]).forEach(m=>{
    if(!(tagsOrigem||[]).includes(m.from)) return;
    if(!(tagsAlvo||[]).includes(m.to)) return;
    mult*=(typeof m.mult==='number'?m.mult:1);
    dice+=(m.dice||0);
    const nm=id=>((sys.tags||[]).find(t=>t.id===id)||{}).name||'?';
    notas.push(nm(m.from)+' ▸ '+nm(m.to)+' ×'+m.mult+(m.dice?(' '+sign(m.dice)+'d'):'')+(m.nota?(' — '+m.nota):''));
  });
  return {mult, dice, notas};
}
function effectLabel(sys,ef){
  if(ef.kind==='livre'){ const n=(ef.mods||[]).length; return (ef.text||'efeito único')+(n?(' ('+n+' mod.)'):''); }
  if(ef.kind==='atributo'){const a=sys.attributes.find(x=>x.id===ef.targetId);return sign(ef.value)+' '+(a?a.name:'?');}
  if(ef.kind==='recurso'){const r=sys.resources.find(x=>x.id===ef.targetId);return sign(ef.value)+' '+(r?r.name:'?')+' (máx)';}
  if(ef.kind==='pericia'){const k=sys.skills.find(x=>x.id===ef.targetId);return 'Concede '+(k?k.name:'?');}
  if(ef.kind==='caracteristica'){const nm=(ef.text||'').trim()||'?'; return ef.charType==='num'?('◆ '+nm+' '+sign(+ef.value||0)):('🏷 '+nm);}
  if(ef.kind==='dados'){const e=(DICE_ESCOPOS.find(x=>x[0]===(ef.escopo||'todos'))||[,'?'])[1];
    return '🎲 '+sign(+ef.value||0)+'d em '+e;}
  return '';
}
function reqTags(sys,ab){ const r=ab.req||{}; const out=[];
  if(r.level>0) out.push('Nível '+r.level);
  (r.attrs||[]).forEach(rq=>{const a=sys.attributes.find(x=>x.id===rq.attrId);out.push((a?a.name:'?')+' '+rq.min+'+');});
  return out; }

  ui:{open:{}, sel:null, stack:(window.innerWidth||1024)<640,
      modo:load('nexus_modo')||'avancado',  /* simples esconde os módulos avançados */
      grupo:'fundacao',  /* grupo de abas aberto no modo mestre */
      busca:null,        /* {q} enquanto a paleta Ctrl+K está aberta */
      gloss:null,        /* {termo} ou {q} enquanto o glossário está aberto */
      multi:[],          /* seleção múltipla: ids além do principal */
      zoom:null,         /* null = ajustar à largura; número = zoom manual */
      estiloCopiado:null,/* área de transferência de estilo */
      camadas:false},    /* painel de camadas aberto */
  system: sysLoaded,
  draft: wasReset?null:load('nexus_draft'),
  step:0,
  saved: load('nexus_characters') || [],
  dice:{qty:1,die:20,attrId:'',result:null,vd:0,escopo:'pericia',livre:false,expr:''},
  toast:null,
};
S.draft = S.draft ? sanitizeDraft(S.draft,S.system) : initDraft(S.system);

let quotaWarned=false;
function persist(){
  try{ store('nexus_system',S.system); store('nexus_draft',S.draft); store('nexus_characters',S.saved); }
  catch(e){
    /* Uma foto grande demais pode estourar a cota do navegador. Avisa uma vez
       em vez de deixar a exceção subir e matar o render(). */
    if(!quotaWarned){ quotaWarned=true;
      alert('Não foi possível salvar: o armazenamento do navegador está cheio.\n\nProvável causa: fotos de personagem muito grandes. Remova alguma foto ou apague fichas salvas.'); }
  }
}
function render(){
  persist();
  const r=document.getElementById('root'); r.innerHTML=''; r.appendChild(App());
  /* avisa o CSS para abrir espaço à direita quando o painel flutuante está aberto */
  document.body.classList.toggle('painel-aberto', S.view==='mestre'&&S.tab==='ficha'&&!!S.ui.sel);
  fitCanvases();
}
/* Redesenha SÓ o canvas do editor, mantendo o resto da tela intacto.
   Necessário para sliders e seletores de cor: um render() completo recriaria o
   próprio controle no meio do gesto e o arrasto morreria (ver Regra Aprendida #8). */
function refreshCanvas(){
  const alvo=document.querySelector('.cv-fit');
  if(!alvo) return render();
  alvo.replaceWith(canvasNode(S.system, sampleDraft(S.system), 'edit'));
  fitCanvases(); persist();
}
/* O canvas tem largura fixa (CANVAS_W). Depois de montado, medimos o espaço real
   disponível e escalamos para caber — assim o layout do mestre é preservado
   em qualquer tela, sem rolagem horizontal. */
function fitCanvases(){
  document.querySelectorAll('.cv-fit').forEach(fit=>{
    const cv=fit.querySelector('.cv'); if(!cv) return;
    const avail=fit.clientWidth||CANVAS_W;
    /* zoom manual só vale no editor; a ficha do jogador sempre se ajusta à tela */
    const manual=cv.classList.contains('edit')&&S.ui.zoom;
    const sc=manual?S.ui.zoom:Math.min(1, avail/CANVAS_W);
    cv.style.transform='scale('+sc+')';
    cv.dataset.scale=sc;
    fit.style.height=(parseFloat(cv.dataset.h||0)*sc)+'px';
    fit.style.overflowX=(CANVAS_W*sc>avail)?'auto':'';
  });
}
let fitTimer=null;
window.addEventListener('resize',()=>{ clearTimeout(fitTimer); fitTimer=setTimeout(fitCanvases,120); });

/* ============================================================ DESFAZER / REFAZER ============================================================
   Guarda um retrato do SISTEMA INTEIRO antes de cada ação — layout, regras,
   progressão, recursos. (Até a Entrada 004 só cobria o layout, o que fazia o
   Ctrl+Z mentir fora da aba Ficha.) Ações repetidas do mesmo tipo em sequência
   rápida (segurar a seta, arrastar um slider) viram um passo só. */
let undoStack=[], redoStack=[];
const snapLayout=()=>JSON.stringify(S.system);
function pushUndo(tag){
  const s=snapLayout(), last=undoStack[undoStack.length-1];
  if(last && last.s===s) return;
  if(tag && last && last.tag===tag && (Date.now()-last.t)<700){ last.t=Date.now(); return; }
  undoStack.push({s, tag:tag||null, t:Date.now()});
  if(undoStack.length>40) undoStack.shift();
  redoStack.length=0;
}
function applyLayout(json){
  const s=JSON.parse(json);
  S.system=s;
  const sh=S.system.sheet;
  if(!sh || !Array.isArray(sh.blocks) || !sh.blocks.some(b=>b.id===S.ui.sel)) S.ui.sel=null;
}
function undo(){ if(!undoStack.length) return showToast('Nada para desfazer');
  const cur=snapLayout(); redoStack.push({s:cur}); applyLayout(undoStack.pop().s); showToast('↩ Desfeito'); }
function redo(){ if(!redoStack.length) return showToast('Nada para refazer');
  const cur=snapLayout(); undoStack.push({s:cur, tag:null, t:Date.now()}); applyLayout(redoStack.pop().s); showToast('↪ Refeito'); }

/* ============================================================ ATALHOS DO EDITOR ============================================================ */
function duplicarBloco(b){
  const sh=S.system.sheet, t=BLOCK_TYPES[b.key];
  /* duplicar um tipo único criaria justamente o segundo — recusa sempre, não só quando já há outro */
  if(t && !t.multi) return showToast('Só pode haver um bloco de '+t.label);
  pushUndo();
  const spot=freeSpot(sh, b.w, b.h);
  const copia={...JSON.parse(JSON.stringify(b)), id:uid(), x:spot.x, y:spot.y};
  sh.blocks.push(copia); S.ui.sel=copia.id;
  if(copia.y+copia.h+20>sh.canvasH) sh.canvasH=copia.y+copia.h+20;
  showToast('Bloco duplicado');
}
function removerBloco(b){
  const sh=S.system.sheet;
  pushUndo();
  /* remove o grupo inteiro quando há seleção múltipla */
  const alvos=new Set([b.id, ...(estaSelecionado(b.id)?selecionados(sh).map(x=>x.id):[])]);
  const n=alvos.size;
  sh.blocks=sh.blocks.filter(x=>!alvos.has(x.id));
  S.ui.sel=null; S.ui.multi=[]; render();
  if(n>1) showToast(n+' blocos removidos');
}
/* Ctrl+K abre a busca global — vale em qualquer aba, inclusive digitando num campo. */
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){
    e.preventDefault();
    if(S.view!=='mestre') S.view='mestre';
    S.ui.busca=S.ui.busca?null:{q:''};
    render(); return;
  }
  if(e.key==='Escape'&&(S.ui.busca||S.ui.gloss)){ S.ui.busca=null; S.ui.gloss=null; render(); }
});
document.addEventListener('keydown',e=>{
  if(S.view!=='mestre'||S.tab!=='ficha'||S.ui.busca||S.ui.gloss) return;
  const alvo=e.target;
  /* não sequestrar teclas enquanto o mestre digita num campo */
  if(alvo&&(alvo.matches&&alvo.matches('input,textarea,select')||alvo.isContentEditable)) return;
  const sh=S.system.sheet, k=e.key, mod=e.ctrlKey||e.metaKey;
  if(mod && k.toLowerCase()==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
  if(mod && k.toLowerCase()==='y'){ e.preventDefault(); redo(); return; }
  if(mod && k.toLowerCase()==='a'){   /* selecionar tudo */
    e.preventDefault();
    if(!sh.blocks.length) return;
    S.ui.sel=sh.blocks[sh.blocks.length-1].id;
    S.ui.multi=sh.blocks.slice(0,-1).map(x=>x.id);
    render(); return;
  }
  const b=sh.blocks.find(x=>x.id===S.ui.sel);
  if(k==='Escape'){ if(S.ui.sel||(S.ui.multi||[]).length){S.ui.sel=null;S.ui.multi=[];render();} return; }
  if(k==='Tab'){ /* percorre os blocos */
    if(!sh.blocks.length) return; e.preventDefault();
    const i=sh.blocks.findIndex(x=>x.id===S.ui.sel);
    const nx=e.shiftKey?(i<=0?sh.blocks.length-1:i-1):((i+1)%sh.blocks.length);
    S.ui.sel=sh.blocks[nx].id; S.ui.multi=[]; render(); return;
  }
  if(!b) return;
  if(mod && k.toLowerCase()==='d'){ e.preventDefault(); duplicarBloco(b); render(); return; }
  if(k==='Delete'||k==='Backspace'){ e.preventDefault(); removerBloco(b); return; }
  const passo=e.shiftKey?Math.max(1,sh.grid||GRID):1;
  const mv={ArrowLeft:[-passo,0],ArrowRight:[passo,0],ArrowUp:[0,-passo],ArrowDown:[0,passo]}[k];
  if(mv){
    e.preventDefault();
    const grupo=selecionados(sh).filter(x=>!(x.opts&&x.opts.locked));
    if(!grupo.length) return;
    pushUndo('mover:'+grupo.map(x=>x.id).join(','));
    grupo.forEach(x=>{
      x.x=Math.max(0,Math.min(x.x+mv[0], CANVAS_W-x.w));
      x.y=Math.max(0,x.y+mv[1]);
      if(x.y+x.h>sh.canvasH) sh.canvasH=x.y+x.h+20;
    });
    render();
  }
});
function showToast(msg){ S.toast=msg; render(); setTimeout(()=>{S.toast=null;render();},1700); }

/* ============================================================ UI BÁSICA ============================================================ */
function card(title, hint, right){
  const c=h('div',{class:'card'}, h('div',{class:'card-head'},
    h('div',{},h('h3',{},title), hint?h('div',{class:'hint'},hint):null), right||null));
  for(let i=3;i<arguments.length;i++) if(arguments[i]!=null) c.appendChild(node(arguments[i]));
  return c;
}
/* chave = verbete do glossário; quando informada, o rótulo ganha um "?" */
function field(label, control, chave){
  return h('label',{class:'f'}, h('span',{},label, chave?aj(chave):null), control);
}
function numField(label,obj,key){
  return field(label, h('input',{class:'in',type:'number',value:obj[key],onchange:e=>{obj[key]=parseInt(e.target.value)||0;render();}}));
}

/* ============================================================ NAVEGAÇÃO DO MESTRE ============================================================
   As 16 abas soltas viraram 4 grupos com sub-abas. Cada aba declara aqui o
   grupo a que pertence, se é avançada (escondida no Modo Simples), quantos
   itens já tem (badge) e o que está errado nela (ponto vermelho). */
const TAB_GRUPOS=[
  {k:'fundacao',  ic:'🏗', nome:'Fundação',       sub:'campanha e regras'},
  {k:'personagem',ic:'🧍', nome:'Personagem',     sub:'do que ele é feito'},
  {k:'mundo',     ic:'🌍', nome:'Mundo & Regras', sub:'itens, tags, dados'},
  {k:'saida',     ic:'📤', nome:'Saída',          sub:'ficha e arquivo'},
];
/* ordem = ordem sugerida do "Próximo passo →" */
const TAB_META=[
  {k:'inicio',    ic:'🧭',  nome:'Início',        g:'fundacao'},
  {k:'campanha',  ic:'📛',  nome:'Campanha',      g:'fundacao'},
  {k:'regras',    ic:'⚙️',  nome:'Regras',        g:'fundacao'},
  {k:'atributos', ic:'💪',  nome:'Atributos',     g:'personagem'},
  {k:'recursos',  ic:'❤️',  nome:'Recursos',      g:'personagem'},
  {k:'pericias',  ic:'🎯',  nome:'Perícias',      g:'personagem'},
  {k:'classes',   ic:'🎭',  nome:'Classes',       g:'personagem'},
  {k:'racas',     ic:'🌱',  nome:'Origem / Raça', g:'personagem'},
  {k:'progressao',ic:'📈',  nome:'Progressão',    g:'fundacao',   adv:true},
  {k:'escolhas',  ic:'🌿',  nome:'Escolhas',      g:'personagem', adv:true},
  {k:'itens',     ic:'🎒',  nome:'Itens',         g:'mundo'},
  {k:'dados',     ic:'🎲',  nome:'Dados',         g:'mundo'},
  {k:'condicoes', ic:'🩸',  nome:'Condições',     g:'mundo',      adv:true},
  {k:'tags',      ic:'🏷',  nome:'Tags',          g:'mundo',      adv:true},
  {k:'tecnicas',  ic:'🌀',  nome:'Técnicas',      g:'mundo',      adv:true},
  {k:'ficha',     ic:'🖼️',  nome:'Ficha',         g:'saida'},
  {k:'sistema',   ic:'💾',  nome:'Sistema',       g:'saida'},
];
function tabMeta(k){ return TAB_META.find(t=>t.k===k)||TAB_META[0]; }
function tabLabel(k){ const t=tabMeta(k); return t.ic+' '+t.nome; }
function modoSimples(){ return S.ui.modo==='simples'; }
function abasVisiveis(){ return TAB_META.filter(t=>!(t.adv&&modoSimples())); }

/* variáveis de exemplo (atributos no máximo) para validar fórmulas do sistema */
function sysVarsSample(sys){
  const eff=effAttr(sys,sys.attrMax);
  const v={'Nível':sys.maxLevel,'Nivel':sys.maxLevel};
  v[sys.levelName||'Nível']=sys.maxLevel;
  (sys.attributes||[]).forEach(a=>{ v[a.name]=eff; });
  (sys.resources||[]).forEach(r=>{ const n=evalFormula(r.formula,v); if(!Number.isNaN(n)) v[r.name]=n; });
  return v;
}
function formulaRuim(f,vars){ return !!(f&&String(f).trim()) && Number.isNaN(evalFormula(f,vars)); }

/* Problemas por aba — alimenta o ponto vermelho, a aba Início e o verificador. */
function problemasDaAba(sys,k){
  const p=[], v=sysVarsSample(sys), lp=levelPoints(sys,sys.maxLevel);
  const escolhiveis=(sys.skills||[]).filter(s=>!s.auto).length;
  if(k==='campanha'){
    if(!String(sys.campaignName||'').trim()) p.push('A campanha está sem nome.');
    if(!String(sys.name||'').trim()) p.push('O sistema está sem nome.');
  }
  if(k==='regras'){
    if(sys.attrMax<=sys.startAttrValue) p.push('O máximo do atributo ('+sys.attrMax+') não é maior que o valor inicial ('+sys.startAttrValue+').');
    const teto=(sys.attributes||[]).length*(sys.attrMax-sys.startAttrValue);
    if((sys.attributes||[]).length && lp.attrPoints>teto)
      p.push('São '+lp.attrPoints+' pontos de atributo, mas só cabem '+teto+'. O jogador não consegue avançar.');
    if(lp.skillCount>escolhiveis)
      p.push('São '+lp.skillCount+' perícias iniciais, mas só existem '+escolhiveis+' escolhíveis.');
    if(sys.maxLevel<sys.startLevel) p.push('O nível máximo é menor que o inicial.');
    if(sys.attrMode==='modificador'&&formulaRuim(sys.modFormula,{V:10})) p.push('A fórmula do modificador é inválida.');
  }
  if(k==='atributos' && !(sys.attributes||[]).length) p.push('Nenhum atributo cadastrado.');
  if(k==='recursos'){
    (sys.resources||[]).forEach(r=>{
      if(formulaRuim(r.formula,v)) p.push('Recurso “'+r.name+'”: fórmula inválida.');
      const rc=r.recharge||{};
      if(rc.amt==='formula'&&formulaRuim(rc.formula,v)) p.push('Recurso “'+r.name+'”: fórmula de recarga inválida.');
      if(formulaRuim(r.perRound,v)) p.push('Recurso “'+r.name+'”: gasto por rodada inválido.');
    });
    if(!(sys.resources||[]).length) p.push('Nenhum recurso cadastrado.');
  }
  if(k==='pericias'){
    if(!(sys.skills||[]).length) p.push('Nenhuma perícia cadastrada.');
    if(lp.skillCount>escolhiveis) p.push('O sistema pede '+lp.skillCount+' perícias e só há '+escolhiveis+' escolhíveis.');
    if(sys.profMode!=='nenhum'&&!(sys.profTiers||[]).length) p.push('O modo de proficiência está ligado sem nenhum grau definido.');
    if(sys.profMode==='mult'&&formulaRuim(sys.profFormula,v)) p.push('A fórmula de proficiência é inválida.');
  }
  if(k==='classes'){
    if(!(sys.classes||[]).length) p.push('Nenhuma classe cadastrada — o jogador não consegue criar personagem.');
    (sys.classes||[]).forEach(c=>{ if(!String(c.name||'').trim()) p.push('Há uma classe sem nome.'); });
  }
  if(k==='racas' && !(sys.origins||[]).length) p.push('Nenhuma origem/raça cadastrada — o jogador não consegue criar personagem.');
  if(k==='escolhas'){
    (sys.choices||[]).forEach(c=>{
      if(!(c.options||[]).length) p.push('“'+c.name+'” não tem nenhuma opção.');
      else if(c.count>(c.options||[]).length) p.push('“'+c.name+'” pede '+c.count+' escolha(s) e só tem '+(c.options||[]).length+' opção(ões).');
      if(c.level>sys.maxLevel) p.push('“'+c.name+'” só abre no degrau '+c.level+', acima do máximo do sistema.');
    });
  }
  if(k==='itens'){
    if(formulaRuim(sys.cargaFormula,v)) p.push('A fórmula da carga máxima é inválida.');
    (sys.items||[]).forEach(it=>{
      if(it.armor&&it.armor.on&&formulaRuim(it.armor.formula,v)) p.push('Armadura “'+it.name+'”: fórmula inválida.');
      if(it.armor&&it.armor.on&&!it.armor.resId) p.push('Armadura “'+it.name+'” não aponta para nenhum recurso.');
    });
  }
  if(k==='condicoes'){
    (sys.conditions||[]).forEach(c=>{
      (c.componentes||[]).forEach(id=>{ if(!(sys.conditions||[]).some(x=>x.id===id)) p.push('“'+c.name+'” aponta para uma condição que não existe mais.'); });
    });
  }
  if(k==='tags'){
    (sys.tagMatrix||[]).forEach(m=>{ if(!m.from||!m.to) p.push('Há uma relação da matriz sem tag de origem ou destino.'); });
  }
  if(k==='dados'){
    if(sys.rollMode==='soma'&&!/\d*d\d+/i.test(sys.rollBase||'')) p.push('A rolagem base “'+sys.rollBase+'” não tem nenhum dado (ex.: 1d20).');
  }
  if(k==='tecnicas'&&sys.techAtivo){
    if(!(sys.techTiers||[]).length) p.push('O construtor está ligado sem nenhum tier.');
    (sys.techTiers||[]).forEach(t=>{ if(formulaRuim(t.custoFormula,v)) p.push('Tier “'+t.name+'”: fórmula de custo inválida.'); });
  }
  if(k==='ficha'&&!((sys.sheet||{}).blocks||[]).length) p.push('A ficha está vazia — nenhum bloco no papel.');
  return p;
}
/* contador do badge de cada aba (null = aba sem contagem) */
function contagemDaAba(sys,k){
  const n={campanha:(sys.themes||[]).length, atributos:(sys.attributes||[]).length,
    recursos:(sys.resources||[]).length, pericias:(sys.skills||[]).length,
    classes:(sys.classes||[]).length, racas:(sys.origins||[]).length,
    escolhas:(sys.choices||[]).length, itens:(sys.items||[]).length,
    condicoes:(sys.conditions||[]).length, tags:(sys.tags||[]).length,
    progressao:((sys.progression||{}).cols||[]).length,
    tecnicas:sys.techAtivo?(sys.techTiers||[]).length:0,
    ficha:((sys.sheet||{}).blocks||[]).length}[k];
  return n||null;
}
/* Os 12 passos essenciais — barra de progresso e checklist da aba Início. */
function passosEssenciais(sys){
  const lp=levelPoints(sys,sys.maxLevel), v=sysVarsSample(sys);
  const escolhiveis=(sys.skills||[]).filter(s=>!s.auto).length;
  const teto=(sys.attributes||[]).length*(sys.attrMax-sys.startAttrValue);
  return [
    {ok:!!String(sys.campaignName||'').trim(), tab:'campanha', t:'Dar um nome à campanha', s:'Como sua mesa se chama.'},
    {ok:!!String(sys.name||'').trim(),         tab:'campanha', t:'Dar um nome ao sistema', s:'O conjunto de regras que você está criando.'},
    {ok:(sys.themes||[]).length>0,             tab:'campanha', t:'Escolher ao menos um tema', s:'Combate, terror, investigação…'},
    {ok:(sys.attributes||[]).length>0,         tab:'atributos',t:'Criar os atributos', s:'Força, Agilidade, Vigor — o que você quiser.'},
    {ok:sys.attrMax>sys.startAttrValue,        tab:'regras',   t:'Definir uma faixa de atributo válida', s:'O máximo precisa ser maior que o valor inicial.'},
    {ok:!(sys.attributes||[]).length||lp.attrPoints<=teto, tab:'regras', t:'Dar pontos de atributo que cabem na faixa', s:'Hoje: '+lp.attrPoints+' ponto(s), cabem '+teto+'.'},
    {ok:(sys.resources||[]).length>0,          tab:'recursos', t:'Criar ao menos um recurso', s:'Vida, Mana, Sanidade, Defesa…'},
    {ok:!(sys.resources||[]).some(r=>formulaRuim(r.formula,v)), tab:'recursos', t:'Deixar todas as fórmulas de recurso válidas', s:'Sem nenhum “⚠ fórmula inválida”.'},
    {ok:(sys.skills||[]).length>0,             tab:'pericias', t:'Criar as perícias', s:'O que o personagem sabe fazer.'},
    {ok:lp.skillCount<=escolhiveis,            tab:'pericias', t:'Pedir menos perícias do que existem', s:'Pede '+lp.skillCount+', existem '+escolhiveis+' escolhíveis.'},
    {ok:(sys.classes||[]).length>0&&(sys.origins||[]).length>0, tab:'classes', t:'Cadastrar ao menos 1 classe e 1 origem', s:'Sem isso o jogador trava no primeiro passo.'},
    {ok:(((sys.sheet||{}).blocks)||[]).length>0, tab:'ficha',  t:'Montar a ficha', s:'Ao menos um bloco no papel.'},
  ];
}
/* ---------- Aba Início: onde o mestre entende o que falta ---------- */
function tabInicio(sys){
  const passos=passosEssenciais(sys);
  const feitos=passos.filter(p=>p.ok).length;
  const problemas=[];
  abasVisiveis().forEach(t=>problemasDaAba(sys,t.k).forEach(msg=>problemas.push({tab:t.k,msg})));
  const linha=p=>h('button',{class:'chk-l '+(p.ok?'ok':''),onclick:()=>{irParaAba(p.tab);}},
    h('span',{class:'mk'}, p.ok?'✔':'○'),
    h('span',{}, h('b',{},p.t), h('span',{class:'sub'}, p.s+'  ·  abrir '+tabLabel(p.tab)+' →')));
  return h('div',{},
    card('Por onde começar','Os 12 passos essenciais para o sistema ficar jogável. Clique em qualquer linha para ir direto ao lugar.',
      h('span',{class:'badge '+(feitos===passos.length?'ok':'warn')}, feitos+'/'+passos.length),
      ...passos.map(linha)),
    card('Verificação','O que o app encontrou de errado nas abas visíveis agora.',
      h('span',{class:'badge '+(problemas.length?'warn':'ok')}, problemas.length?(problemas.length+' problema(s)'):'tudo certo'),
      problemas.length
        ? h('div',{}, ...problemas.map(pr=>h('button',{class:'chk-l',onclick:()=>irParaAba(pr.tab)},
            h('span',{class:'mk',style:{color:'#fb7185'}},'⚠'),
            h('span',{}, pr.msg, h('span',{class:'sub'},'em '+tabLabel(pr.tab)+' →')))))
        : h('div',{class:'hint'},'Nenhum problema encontrado. '+(modoSimples()?'(As abas avançadas estão ocultas no Modo Simples e não foram verificadas.)':'')),

/* Faixa dos acentos combinantes montada por escape: escrever os caracteres
   direto no fonte deixaria bytes invisíveis no arquivo. */
const RE_ACENTO=new RegExp('[\\u0300-\\u036f]','g');
function semAcento(s){ return String(s).normalize('NFD').replace(RE_ACENTO,'').toLowerCase(); }
