/* ============================================================ CAMPO DE FÓRMULA ============================================================
   Uma peça só resolve os sete problemas do item 19 ao 25: realce, autocomplete,
   construtor por chips, lista de variáveis, prévia em 3 pontos, erro específico
   e fórmulas prontas. Todo campo de fórmula do app passa a usar isto.

   O realce é um espelho: um <div> colorido embaixo e o <input> por cima com o
   texto transparente. Precisam ter EXATAMENTE a mesma fonte, padding e borda —
   qualquer diferença desalinha as cores do texto real. */

/* Valor representativo de um atributo no degrau lv — serve só para a prévia. */
function attrNoDegrau(sys,lv){
  const a=sys.startLevel||1, b=sys.maxLevel||1;
  const t=(b>a)?((lv-a)/(b-a)):1;
  return Math.round((sys.startAttrValue||0)+((sys.attrMax||0)-(sys.startAttrValue||0))*t);
}
/* Variáveis visíveis num degrau: atributos, o eixo, recursos e colunas da tabela. */
function varsNoDegrau(sys,lv){
  const v={}, av=effAttr(sys,attrNoDegrau(sys,lv));
  v['Nível']=lv; v['Nivel']=lv; v[sys.levelName||'Nível']=lv;
  (sys.attributes||[]).forEach(a=>{ if(a.name) v[a.name]=av; });
  const prog=sys.progression||{}; const row=(prog.rows||{})[lv]||{};
  (prog.cols||[]).forEach(c=>{ if(c.tipo!=='num'||!c.name) return;
    const n=Number(row[c.id]); if(Number.isFinite(n)) v[c.name]=n; });
  (sys.resources||[]).forEach(r=>{ if(!r.name) return;
    const n=evalFormula(r.formula,v); if(!Number.isNaN(n)) v[r.name]=n; });
  return v;
}
/* Os 3 pontos da prévia (item 22): degrau inicial, meio e máximo. */
function pontosPadrao(sys){
  const a=sys.startLevel||1, b=sys.maxLevel||1, m=Math.round((a+b)/2);
  const uns=[...new Set([a,m,b])];
  return uns.map(lv=>({rot:levelLabel(sys,lv), vars:varsNoDegrau(sys,lv)}));
}
/* nomes de variável ordenados do mais longo para o mais curto (exigência do tokenize) */
function nomesDeVars(vars){ return Object.keys(vars).sort((a,b)=>b.length-a.length); }

/* distância de edição curta — só para sugerir "você quis dizer" */
function distancia(a,b){
  a=semAcento(a); b=semAcento(b);
  const m=[];
  for(let i=0;i<=b.length;i++){ m[i]=[i]; }
  for(let j=0;j<=a.length;j++){ m[0][j]=j; }
  for(let i=1;i<=b.length;i++) for(let j=1;j<=a.length;j++)
    m[i][j]=b[i-1]===a[j-1] ? m[i-1][j-1]
      : Math.min(m[i-1][j-1]+1, m[i][j-1]+1, m[i-1][j]+1);
  return m[b.length][a.length];
}
function palavraParecida(alvo,lista){
  let melhor=null, d=99;
  lista.forEach(n=>{ const x=distancia(alvo,n); if(x<d){ d=x; melhor=n; } });
  return (melhor && d<=Math.max(2,Math.floor(melhor.length/3))) ? melhor : null;
}
/* Diagnóstico do texto (item 23): devolve {ok, msg, sugestao:{de,para}} */
function analisarFormula(expr,vars){
  const s=String(expr||'');
  if(!s.trim()) return {ok:true, vazio:true};
  const nomes=nomesDeVars(vars);
  let toks;
  try{ toks=tokenize(s,nomes); }
  catch(e){
    const ruim=(s.match(/[^\wÀ-ÿ\s+\-*/%().,<>=!&|]/)||[])[0];
    return {ok:false, msg:ruim?('O símbolo “'+ruim+'” não vale numa fórmula.')
                            :'Não consegui ler essa fórmula.'};
  }
  /* palavra que não é função nem variável = variável inexistente */
  const desconhecida=toks.find(t=>t.t==='w'&&!FORM_FN_NOMES.includes(t.v)&&!['e','ou'].includes(t.v));
  if(desconhecida){
    /* o tokenize devolve a palavra em minúsculas; mostramos como o mestre digitou */
    const escapada=desconhecida.v.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    const orig=(s.match(new RegExp(escapada,'i'))||[])[0]||desconhecida.v;
    const sug=palavraParecida(desconhecida.v,nomes);
    return {ok:false, msg:'Não conheço “'+orig+'”.'+(sug?'':' Veja a lista de variáveis abaixo.'),
            sugestao:sug?{de:orig,para:sug}:null};
  }
  let abre=0; for(const c of s){ if(c==='(')abre++; if(c===')')abre--; if(abre<0) break; }
  if(abre>0) return {ok:false, msg:abre===1?'Falta fechar 1 parêntese.':('Faltam fechar '+abre+' parênteses.')};
  if(abre<0) return {ok:false, msg:'Há parêntese fechando a mais.'};
  if(/[+\-*/%]\s*$/.test(s)) return {ok:false, msg:'A fórmula termina num operador — falta o que vem depois.'};
  if(Number.isNaN(evalFormula(s,vars))) return {ok:false, msg:'A conta não fecha. Confira a ordem dos operadores.'};
  return {ok:true};
}
/* HTML colorido do espelho (item 25) — mesma varredura do tokenize, tolerante */
function realceHTML(s,nomes){
  let out='', i=0;
  const txt=String(s||'');
  while(i<txt.length){
    const c=txt[i];
    if(c===' '||c==='\t'){ out+=' '; i++; continue; }
    if(/[0-9]/.test(c)||(c==='.'&&/[0-9]/.test(txt[i+1]||''))){
      let n=''; while(i<txt.length&&/[0-9.]/.test(txt[i])) n+=txt[i++];
      out+='<span class="fx-n">'+esc(n)+'</span>'; continue;
    }
    if('+-*/%(),<>!=&|'.includes(c)){ out+='<span class="fx-o">'+esc(c)+'</span>'; i++; continue; }
    if(ehLetra(c)){
      let fn=null;
      for(const nome of FORM_FN_NOMES){
        if(txt.substr(i,nome.length).toLowerCase()===nome && !ehLetra(txt[i+nome.length]||'')){ fn=nome; break; }
      }
      if(fn){ out+='<span class="fx-f">'+esc(txt.substr(i,fn.length))+'</span>'; i+=fn.length; continue; }
      let casou=null;
      for(const n of nomes){
        if(n && txt.substr(i,n.length).toLowerCase()===n.toLowerCase()){
          const dep=txt[i+n.length]; if(!dep||!ehLetra(dep)){ casou=n; break; }
        }
      }
      if(casou){ out+='<span class="fx-v">'+esc(txt.substr(i,casou.length))+'</span>'; i+=casou.length; continue; }
      let w=''; while(i<txt.length&&ehLetra(txt[i])) w+=txt[i++];
      out+='<span class="fx-x">'+esc(w)+'</span>'; continue;
    }
    out+='<span class="fx-x">'+esc(c)+'</span>'; i++;
  }
  return out||'&nbsp;';
}
/* Fórmulas prontas por contexto (item 24) — usam nomes reais do sistema. */
function formulasProntas(sys,tipo){
  const at=(sys.attributes||[]).map(a=>a.name).filter(Boolean);
  const A=at[0]||'Força', B=at[1]||A, N=sys.levelName||'Nível';
  const L={
    recurso:[['Base + atributo','10 + '+A],['Cresce por degrau','8 + '+A+' * 2 + '+N+' * 5'],
             ['Só do atributo',A+' * 10'],['Fixo','20'],['Menor entre dois','menor('+A+' * 5, 50)']],
    defesa: [['Base + atributo','10 + '+B],['Base fixa','12'],['Dois atributos','8 + '+A+' + '+B],
             ['Com teto','menor(10 + '+B+', 18)']],
    carga:  [['Pelo atributo',A+' * 5'],['Base + atributo','10 + '+A+' * 2'],['Fixa','30']],
    mod:    [['Estilo D&D','(V - 10) / 2'],['Metade do valor','V / 2'],['Valor cheio','V']],
    prof:   [['Cresce a cada 4 degraus','2 + piso(('+N+' - 1) / 4)'],['Metade do degrau','piso('+N+' / 2)'],
             ['Fixo','3']],
    recarga:[['Metade do degrau','piso('+N+' / 2)'],['Pelo atributo',A],['Fixo','5']],
    perround:[['Fração do degrau','piso('+N+' / 5)'],['Fixo','2']],
    custo:  [['Base + degrau','2 + '+N+' / 5'],['Só base','3'],['Cresce rápido','2 + '+N]],
  }[tipo]||[['Base + atributo','10 + '+A],['Pelo degrau',N+' * 2']];
  return L;
}
/* ---------- o campo em si ---------- */
/* obj[key] é a fórmula. opts: {tipo, pontos, placeholder, aoMudar} */
function campoFormula(sys,obj,key,opts){
  opts=opts||{};
  const pontos=opts.pontos||pontosPadrao(sys);
  const vars=pontos[pontos.length-1].vars;
  const nomes=nomesDeVars(vars);
  const raiz=h('div',{class:'fx'});
  const hl=h('div',{class:'fx-hl'});
  const inp=h('input',{class:'in fx-in',value:obj[key]||'',placeholder:opts.placeholder||'',spellcheck:'false'});
  const sug=h('div',{class:'hide'});
  const caixa=h('div',{class:'fx-box'}, hl, inp, sug);
  const prev=h('div',{class:'fx-prev'});
  const err=h('div',{class:'fx-err hide'});
  const montarBtn=h('button',{class:'btn sm ghost',type:'button'},'⊞ Montar');
  const painel=h('div',{class:'fx-mont hide'});
  let iSug=0, itensSug=[];

  const inserir=txt=>{
    const a=inp.selectionStart??inp.value.length, b=inp.selectionEnd??a;
    const antes=inp.value.slice(0,a), depois=inp.value.slice(b);
    /* espaço automático entre um token e outro, menos antes de "(" e ")" */
    const pre=(antes && !/[\s(]$/.test(antes) && !/^[)(,]/.test(txt))?' ':'';
    inp.value=antes+pre+txt+depois;
    const pos=(antes+pre+txt).length;
    inp.focus(); inp.setSelectionRange(pos,pos);
    atualizar();
  };
  /* palavra sendo digitada no cursor, para o autocomplete (item 21) */
  const palavraNoCursor=()=>{
    const p=inp.selectionStart??inp.value.length;
    let i=p; while(i>0&&ehLetra(inp.value[i-1])) i--;
    return {ini:i, txt:inp.value.slice(i,p)};
  };
  const fecharSug=()=>{ sug.className='hide'; sug.innerHTML=''; itensSug=[]; };
  const abrirSug=()=>{
    const w=palavraNoCursor();
    if(w.txt.length<1){ fecharSug(); return; }
    const t=semAcento(w.txt);
    itensSug=[...nomes.filter(n=>semAcento(n).startsWith(t)).map(n=>({t:n,tp:'variável'})),
              ...FORM_FN_NOMES.filter(n=>n.startsWith(t)).map(n=>({t:n+'(',tp:'função'}))].slice(0,8);
    if(!itensSug.length){ fecharSug(); return; }
    iSug=0; sug.className='fx-sug'; sug.innerHTML='';
    itensSug.forEach((it,i)=>sug.appendChild(h('button',{class:i===0?'foco':'',type:'button',
      onmousedown:e=>{ e.preventDefault(); aceitarSug(i); }},
      h('span',{},it.t), h('span',{class:'tp'},it.tp))));
  };
  const aceitarSug=i=>{
    const it=itensSug[i]; if(!it) return;
    const w=palavraNoCursor(), p=inp.selectionStart??0;
    inp.value=inp.value.slice(0,w.ini)+it.t+inp.value.slice(p);
    const pos=w.ini+it.t.length;
    inp.focus(); inp.setSelectionRange(pos,pos);
    fecharSug(); atualizar();
  };
  const atualizar=()=>{
    obj[key]=inp.value; persist();
    hl.innerHTML=realceHTML(inp.value,nomes);
    hl.scrollLeft=inp.scrollLeft;
    const an=analisarFormula(inp.value,vars);
    inp.classList.toggle('ruim',!an.ok);
    /* prévia nos 3 pontos (item 22) */
    prev.innerHTML='';
    if(an.ok&&!an.vazio){
      pontos.forEach(p=>{
        const n=evalFormula(inp.value,p.vars);
        prev.appendChild(h('span',{class:'fx-pt'}, p.rot+': ', h('b',{},Number.isNaN(n)?'—':String(n))));
      });
    } else if(an.vazio){ prev.appendChild(h('span',{class:'hint'},'Vazio.')); }
    /* erro específico (item 23) */
    err.innerHTML='';
    if(an.ok){ err.className='fx-err hide'; }
    else{
      err.className='fx-err';
      err.appendChild(node('⚠ '+an.msg));
      if(an.sugestao) err.appendChild(h('button',{type:'button',
        onclick:()=>{ inp.value=inp.value.replace(new RegExp(an.sugestao.de,'i'),an.sugestao.para);
                      atualizar(); inp.focus(); }},'usar “'+an.sugestao.para+'”'));
    }
  };
  inp.addEventListener('input',()=>{ atualizar(); abrirSug(); });
  inp.addEventListener('scroll',()=>{ hl.scrollLeft=inp.scrollLeft; });
  inp.addEventListener('blur',()=>{ fecharSug(); if(opts.aoMudar) opts.aoMudar(); });
  inp.addEventListener('keydown',e=>{
    if(!itensSug.length){ if(e.key==='Enter'&&opts.aoMudar){ opts.aoMudar(); } return; }
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      e.preventDefault();
      iSug=(iSug+(e.key==='ArrowDown'?1:itensSug.length-1))%itensSug.length;
      [...sug.children].forEach((b,i)=>b.className=(i===iSug?'foco':''));
      return;
    }
    if(e.key==='Enter'||e.key==='Tab'){ e.preventDefault(); aceitarSug(iSug); return; }
    if(e.key==='Escape'){ e.stopPropagation(); fecharSug(); }
  });

  /* --- construtor: variáveis (20), operadores/funções (19), prontas (24) --- */
  const chips=(lista,cls)=>h('div',{class:'fx-chips'}, ...lista.map(([rot,txt,sub])=>
    h('button',{class:'fx-chip '+(cls||''),type:'button',title:sub||'',onclick:()=>inserir(txt)},
      sub?h('span',{},rot,h('small',{},sub)):rot)));
  const montaPainel=()=>{
    painel.innerHTML='';
    const vs=nomes.slice().sort((a,b)=>a.localeCompare(b))
      .map(n=>[n,n,'= '+(Number.isFinite(vars[n])?vars[n]:'?')]);
    painel.appendChild(h('div',{class:'fx-grp'},'Fórmulas prontas — clique para usar'));
    painel.appendChild(h('div',{class:'fx-chips'}, ...formulasProntas(sys,opts.tipo).map(([rot,txt])=>
      h('button',{class:'fx-chip pr',type:'button',onclick:()=>{ inp.value=txt; atualizar(); inp.focus(); }},
        h('span',{},rot,h('small',{},txt))))));
    painel.appendChild(h('div',{class:'fx-grp'},'Variáveis disponíveis'+(opts.tipo==='mod'?'':' (valor no último degrau)')));
    painel.appendChild(chips(vs));
    painel.appendChild(h('div',{class:'fx-grp'},'Operadores'));
    painel.appendChild(chips([['+','+'],['−','-'],['×','*'],['÷','/'],['(','('],[')',')'],[',',',']],'op'));
    painel.appendChild(h('div',{class:'fx-grp'},'Funções'));
    painel.appendChild(chips([['piso()','piso(','arredonda para baixo'],['teto()','teto(','arredonda para cima'],
      ['arredondar()','arredondar(','arredonda normal'],['menor()','menor(','o menor entre os valores'],
      ['maior()','maior(','o maior entre os valores'],['se()','se(','se(condição, então, senão)'],
      ['abs()','abs(','valor sem sinal']],'fn'));
  };
  montarBtn.addEventListener('click',()=>{
    const abrir=painel.classList.contains('hide');
    if(abrir) montaPainel();
    painel.className=abrir?'fx-mont':'fx-mont hide';
    montarBtn.textContent=abrir?'⊟ Fechar':'⊞ Montar';
  });

  raiz.appendChild(caixa);
  raiz.appendChild(h('div',{class:'fx-bar'}, montarBtn, prev));
  raiz.appendChild(err);
  raiz.appendChild(painel);
  atualizar();
  return raiz;
}

/* ---------- Editor de tabela de progressão (usado no sistema e em cada classe) ---------- */
function progEditor(sys, prog, opts){
  opts=opts||{};
  sanitizeProg(prog);
  const de=sys.startLevel||1, ate=Math.max(de, sys.maxLevel||de);
  const niveis=[]; for(let l=de;l<=ate;l++) niveis.push(l);
  if(niveis.length>60) niveis.length=60;   /* trava de segurança p/ maxLevel absurdo */

  const addCol=()=>{ pushUndo(); prog.cols.push({id:uid(), name:'Coluna '+(prog.cols.length+1), tipo:'num'}); render(); };

  /* preencher uma coluna inteira com uma fórmula (ex.: 2 + piso((Nível-1)/4) ) */
  const preencher=col=>{
    const exemplo = col.tipo==='num' ? '2 + piso((' + (sys.levelName||'Nível') + ' - 1) / 4)' : '';
    const f=prompt('Preencher "'+col.name+'" com uma fórmula, aplicada em cada degrau.\n\n'+
      'Use "'+(sys.levelName||'Nível')+'" como o número do degrau.\nEx.: '+exemplo, exemplo);
    if(f==null) return;
    pushUndo();

/* Aplica um descanso: cada recurso decide sozinho se recupera e quanto. */
function aplicarDescanso(tipo){
  const sys=S.system, d=S.draft;
  const ctx=computeSheet(sys,d);
  let n=0;
  ctx.allRes.forEach(r=>{
    if((r.type||'barra')==='valor') return;
    const rc=r.recharge||{};
    if(rc.trig!==tipo) return;
    const max=r.max; if(Number.isNaN(max)) return;
    const cur=d.resCurrent[r.id]==null?max:d.resCurrent[r.id];
    let novo=cur;
    if((rc.amt||'tudo')==='tudo') novo=max;
    else if(rc.amt==='metade') novo=Math.min(max, cur+Math.max(1,Math.floor(max/2)));
    else if(rc.amt==='formula'){
      const add=evalFormula(rc.formula, ctx.varsTotal);
      if(!Number.isNaN(add)) novo=Math.min(max, cur+add);
    }
    novo=Math.max(0,Math.min(max,novo));
    if(novo!==cur){ d.resCurrent[r.id]=novo; n++; }
  });
  render();
  showToast(n? (tipo==='curto'?'Descanso curto: ':'Descanso longo: ')+n+' recurso(s) recuperado(s)' : 'Nada a recuperar neste descanso');
}

    h('div',{class:'hint',style:{marginTop:'4px'}}, it.equipavel
      ? 'Equipável: os efeitos abaixo entram na ficha ao equipar o item.'

    itemSlotBox(sys,it),
    itemAtaqueBox(sys,it),
    itemArmaduraBox(sys,it),

  return h('div',{class:'acc'}, header, body);

/* ============================================================ PEÇA 1 — PONTOS DE ESCOLHA ============================================================
   "Escolha 1 de N", com pré-requisito por opção. É o que destrava subclasse,
   trilha, talento e "aumento de atributo OU talento". O motor não sabe o nome

function tabEscolhas(sys){
  return card(tit('Pontos de Escolha','escolha'),
    'Um ponto de escolha aparece no assistente do jogador quando ele atinge o degrau indicado. Serve para subclasse, trilha, talento, dom — qualquer "escolha 1 de N".',
    h('button',{class:'btn primary',onclick:()=>{
      const c={id:uid(),name:'Nova Escolha',hint:'',level:sys.startLevel||1,count:1,repetivel:false,options:[]};
      sys.choices.push(c); S.ui.open[c.id]=true; render();}},'+ Ponto de Escolha'),
    sys.choices.length?null:h('div',{class:'hint'},
      'Nenhum ponto de escolha ainda. Exemplos: "Subclasse" no degrau 3 (escolha 1), "Talento" a cada 4 degraus (escolha 1, repetível), "Trilha" no degrau 2.'),
    ...sys.choices.map(c=>escolhaEditor(sys,c)));
}
function escolhaEditor(sys,ch){
  const open=!!S.ui.open[ch.id];
  const header=h('div',{class:'acc-head',onclick:()=>{S.ui.open[ch.id]=!open;render();}},
    h('div',{class:'row'}, h('span',{class:'acc-caret'},open?'▼':'▶'), h('span',{class:'acc-title'},ch.name||'(sem nome)')),
    h('div',{class:'row'}, h('span',{class:'acc-meta'},
      (sys.levelName||'Nível')+' '+ch.level+' · escolhe '+ch.count+' de '+(ch.options||[]).length+(ch.repetivel?' · repetível':'')),
      h('button',{class:'btn danger sm',onclick:e=>{e.stopPropagation();sys.choices=sys.choices.filter(x=>x.id!==ch.id);delete S.ui.open[ch.id];render();}},'✕')));
  if(!open) return h('div',{class:'acc'}, header);

  /* todas as opções do sistema, para o pré-requisito "exige outra opção" */
  const todasOpcoes=[];
  (sys.choices||[]).forEach(c=>(c.options||[]).forEach(o=>{ if(o.id!==undefined) todasOpcoes.push({c,o}); }));

  const body=h('div',{class:'acc-body'},
    h('div',{class:'grid g3',style:{marginTop:'12px'}},
      field('Nome', h('input',{class:'in',value:ch.name,placeholder:'Ex.: Subclasse',oninput:e=>{ch.name=e.target.value;persist();},onchange:()=>render()})),
      field('Libera no degrau', h('input',{class:'in',type:'number',value:ch.level,onchange:e=>{ch.level=parseInt(e.target.value)||1;render();}})),
      field('Quantas escolhe', h('input',{class:'in',type:'number',min:'1',value:ch.count,onchange:e=>{ch.count=Math.max(1,parseInt(e.target.value)||1);render();}}))),
    h('div',{style:{marginTop:'8px'}}, field('Explicação para o jogador',
      h('input',{class:'in',value:ch.hint||'',placeholder:'Ex.: Sua especialização define seu estilo de combate.',oninput:e=>{ch.hint=e.target.value;persist();}}))),
    h('div',{style:{marginTop:'8px'}},
      h('button',{class:'btn sm '+(ch.repetivel?'emerald':'ghost'),onclick:()=>{ch.repetivel=!ch.repetivel;render();}},
        (ch.repetivel?'✓ ':'')+'Repetível (a mesma opção pode ser pega mais de uma vez)')),
    h('div',{class:'sub-h'},'Opções'),
    ...(ch.options||[]).map(op=>{
      const preSel=h('select',{class:'in',style:{maxWidth:'220px'},onchange:e=>{
        const v=e.target.value; op.req.choices = v?[v]:[]; render();}});
      preSel.appendChild(h('option',{value:''},'— sem pré-requisito de opção —'));
      todasOpcoes.forEach(({c,o})=>{ if(o.id===op.id) return;
        const el=h('option',{value:o.id}, c.name+' → '+o.name);
        if((op.req.choices||[])[0]===o.id) el.selected=true; preSel.appendChild(el); });
      return h('div',{class:'ability-card'},
        h('div',{class:'row'},
          h('input',{class:'in',value:op.name,placeholder:'Nome da opção',oninput:e=>{op.name=e.target.value;persist();},onchange:()=>render()}),
          h('button',{class:'btn danger sm',onclick:()=>{ch.options=ch.options.filter(x=>x.id!==op.id);render();}},'✕')),
        h('input',{class:'in',style:{marginTop:'6px'},value:op.description||'',placeholder:'O que ela representa',oninput:e=>{op.description=e.target.value;persist();}}),
        reqEditor(sys,op),
        h('div',{style:{marginTop:'6px'}}, field('Exige outra opção já escolhida', preSel)),
        h('div',{class:'sub-h2'},'Efeitos mecânicos'),
        ...(op.effects||[]).map(ef=>effectRow(sys,op.effects,ef,0)),
        h('button',{class:'btn ghost sm',onclick:()=>{op.effects.push(newEffect(sys));render();}},'+ Efeito'),
        h('div',{class:'tags'}, ...reqTags(sys,op).map(t=>h('span',{class:'tg-req'},'🔒 '+t)),
          ...(op.effects||[]).map(ef=>h('span',{class:'tg-fx'},effectLabel(sys,ef)))));
    }),
    h('button',{class:'btn sm',onclick:()=>{ch.options.push({id:uid(),name:'Nova opção',description:'',req:{level:0,attrs:[],choices:[]},effects:[]});render();}},'+ Opção'));
  return h('div',{class:'acc'}, header, body);
}

      const c={id:uid(),name:'Nova Condição',icon:'⚠',color:'#e11d48',description:'',noStack:true,niveis:0,componentes:[],effects:[]};
      sys.conditions.push(c); S.ui.open[c.id]=true; render();}},'+ Condição'),
    sys.conditions.length?null:h('div',{class:'hint'},
      'Nenhuma condição ainda. Exemplos: Envenenado (−1d em todas as rolagens), Fraco (−2 Força), Fatigado (= Fraco + Vulnerável), Exaustão (6 níveis cumulativos).'),
    ...sys.conditions.map(c=>condicaoEditor(sys,c)));
}
function condicaoEditor(sys,c){

  if(!open) return h('div',{class:'acc'}, header);
  const body=h('div',{class:'acc-body'},
    h('div',{class:'grid g3',style:{marginTop:'12px'}},
      field('Nome', h('input',{class:'in',value:c.name,oninput:e=>{c.name=e.target.value;persist();},onchange:()=>render()})),
      field('Ícone', h('input',{class:'in',style:{textAlign:'center'},value:c.icon||'',placeholder:'⚠',oninput:e=>{c.icon=e.target.value;persist();},onchange:()=>render()})),
      field('Cor', h('input',{type:'color',value:c.color||'#e11d48',style:{width:'100%',height:'40px',background:'transparent',border:'1px solid var(--line)',borderRadius:'10px',cursor:'pointer',marginTop:'4px'},oninput:e=>{c.color=e.target.value;persist();},onchange:()=>render()}))),
    h('div',{style:{marginTop:'8px'}}, field('Descrição', h('textarea',{class:'in',rows:'2',value:c.description||'',oninput:e=>{c.description=e.target.value;persist();}}))),
    h('div',{class:'grid g2',style:{marginTop:'8px',alignItems:'end'}},
      field('Níveis cumulativos (0 = sem trilha)',
        h('input',{class:'in',type:'number',min:'0',max:'20',value:c.niveis||0,

        onclick:()=>{c.noStack=!(c.noStack!==false);render();}},(c.noStack!==false?'✓ ':'')+'Não empilha (a mesma condição não conta 2×)'))),
    c.niveis>0?h('div',{class:'hint',style:{marginTop:'4px'}},'Com trilha de níveis, cada efeito é multiplicado pelo nível atual (nível 3 de "−1 Força" = −3).'):null,
    h('div',{class:'sub-h'},'Composta por (esta condição aplica também estas)'),
    h('div',{class:'row wrapf'}, ...(sys.conditions||[]).filter(x=>x.id!==c.id).map(o=>{

        (on?'✓ ':'')+(o.icon||'')+' '+o.name);})),
    (sys.conditions||[]).length<2?h('div',{class:'hint'},'Crie outra condição para poder compor.'):null,

/* ============================================================ PEÇA 7 — TAGS E MATRIZ DE INTERAÇÃO ============================================================

function tabTags(sys){

  const selTag=(val,cb)=>{ const s=h('select',{class:'in',style:{maxWidth:'170px'},onchange:e=>{cb(e.target.value);render();}});
    s.appendChild(h('option',{value:''},'— escolha —'));
    (sys.tags||[]).forEach(t=>{const o=h('option',{value:t.id},t.name);if(t.id===val)o.selected=true;s.appendChild(o);});
    return s; };
  return h('div',{},
    card(tit('Tags','tag'),'Etiquetas que classificam dano, elementos, criaturas ou materiais. Use nas armas e nas condições.',
      h('button',{class:'btn primary',onclick:()=>{sys.tags.push({id:uid(),name:'Nova Tag',color:'#6366f1'});render();}},'+ Tag'),
      sys.tags.length?null:h('div',{class:'hint'},'Ex.: Fogo, Gelo, Corte, Impacto, Paranormal, Sangue, Morte, Energia, Conhecimento.'),
      ...sys.tags.map(t=>h('div',{class:'row',style:{marginBottom:'6px'}},
        h('input',{type:'color',value:t.color,style:{width:'38px',height:'38px',background:'transparent',border:'none',padding:'0',cursor:'pointer'},oninput:e=>{t.color=e.target.value;persist();}}),
        h('input',{class:'in',value:t.name,oninput:e=>{t.name=e.target.value;persist();},onchange:()=>render()}),

          sys.tags=sys.tags.filter(x=>x.id!==t.id);
          sys.tagMatrix=sys.tagMatrix.filter(m=>m.from!==t.id&&m.to!==t.id);
          (sys.items||[]).forEach(it=>{ if(it.attack) it.attack.tags=(it.attack.tags||[]).filter(x=>x!==t.id); });
          render();}},'✕')))),
    card(tit('Matriz de Interação','matriz'),'Quando uma tag ATINGE outra: multiplica o dano e/ou mexe na quantidade de dados. A relação é direcional.',
      h('button',{class:'btn primary',disabled:(sys.tags||[]).length<1,
        onclick:()=>{sys.tagMatrix.push({id:uid(),from:(sys.tags[0]||{}).id||'',to:(sys.tags[0]||{}).id||'',mult:2,dice:0,nota:''});render();}},'+ Relação'),
      (sys.tags||[]).length<1?h('div',{class:'hint'},'Crie ao menos uma tag primeiro.'):null,
      sys.tagMatrix.length?null:h('div',{class:'hint'},
        'Ex.: Fogo ▸ Gelo = ×2 (vulnerabilidade) · Fogo ▸ Fogo = ×0.5 (resistência) · Sangue ▸ Conhecimento = ×1 e +1 dado (ciclo de opressão).'),
      ...sys.tagMatrix.map(m=>h('div',{class:'item',style:{marginBottom:'8px'}},
        h('div',{class:'row wrapf',style:{alignItems:'flex-end'}},
          field('Quando', selTag(m.from,v=>{m.from=v;})),
          h('span',{style:{fontSize:'20px',padding:'0 4px'}},'▸'),
          field('Atinge', selTag(m.to,v=>{m.to=v;})),
          field('Dano ×', h('input',{class:'in',type:'number',step:'0.25',style:{width:'90px'},value:m.mult,
            onchange:e=>{m.mult=parseFloat(e.target.value);if(Number.isNaN(m.mult))m.mult=1;render();}})),
          field('Dados', h('input',{class:'in',type:'number',style:{width:'80px'},value:m.dice||0,
            title:'Modificador no canal de dados',onchange:e=>{m.dice=parseInt(e.target.value)||0;render();}})),
          h('button',{class:'btn danger sm',onclick:()=>{sys.tagMatrix=sys.tagMatrix.filter(x=>x.id!==m.id);render();}},'✕')),
        h('input',{class:'in',style:{marginTop:'6px'},value:m.nota||'',placeholder:'Anotação (aparece na simulação)',oninput:e=>{m.nota=e.target.value;persist();}}),
        h('div',{class:'hint',style:{marginTop:'4px'}},
          nomeTag(m.from)+' atingindo '+nomeTag(m.to)+': dano ×'+m.mult+(m.dice?(', '+sign(m.dice)+' dado(s)'):''))))));
}

/* Média de uma expressão de dados, para comparar teto sem precisar rolar.
   NÃO passa por evalFormula: ele arredonda para baixo no fim, e a média de
   1d8 (4,5) viraria 4 — o que afrouxa o teto do tier em meio ponto. */
function mediaExpr(expr, vars){
  const media=String(expr==null?'':expr).replace(DICE_RE,(m,q,f)=>{
    const qtd=Math.max(1,parseInt(q||'1')||1), faces=Math.max(2,parseInt(f)||2);
    return '('+(qtd*(faces+1)/2)+')';
  });
  const v=vars||{};
  try{
    const r=parseTokens(tokenize(media, Object.keys(v).sort((a,b)=>b.length-a.length)), v);
    return Number.isFinite(r)?r:NaN;
  }catch(e){ return NaN; }
}
function tetoInfo(sys,t){
  const v=mediaExpr(t.danoMax,{});
  if(!(t.danoMax||'').trim()) return 'Sem teto de dano definido.';
  return Number.isNaN(v) ? '⚠ expressão de teto inválida' : ('Teto ≈ '+v+' de dano médio.');
}

/* Adiciona um bloco numa posição exata (usado ao soltar da paleta). */
function addBlockAt(key,x,y){
  const sh=S.system.sheet, t=BLOCK_TYPES[key];
  pushUndo();
  const bx=Math.max(0,Math.min(Math.round(x/GRID)*GRID, CANVAS_W-t.w));
  const by=Math.max(0,Math.round(y/GRID)*GRID);
  const b=blk(key, bx, by, t.w, t.h);
  sh.blocks.push(b); S.ui.sel=b.id;
  if(b.y+b.h+20>sh.canvasH) sh.canvasH=b.y+b.h+20;
  render();
  return b;
}
/* Arrastar da paleta para o canvas: um fantasma segue o cursor e o bloco nasce
   onde for solto. Se o gesto não sair do botão, vale como clique e encaixa sozinho. */
function palletDrag(ev,key,btn){
  if(ev.button!=null&&ev.button!==0) return;
  ev.preventDefault();
  const t=BLOCK_TYPES[key];
  const ghost=h('div',{class:'pal-ghost'}, t.icon+' '+t.label);
  document.body.appendChild(ghost);
  let moveu=false;
  const cv=()=>document.querySelector('.cv.edit');
  const dentro=(e,r)=> e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;
  const move=e=>{
    if(Math.abs(e.clientX-ev.clientX)>3||Math.abs(e.clientY-ev.clientY)>3) moveu=true;
    ghost.style.left=(e.clientX+12)+'px'; ghost.style.top=(e.clientY+12)+'px';
    const c=cv(); if(!c) return;
    const ok=dentro(e,c.getBoundingClientRect());
    ghost.classList.toggle('on-drop',ok);
    c.classList.toggle('drop',ok&&moveu);
  };
  const up=e=>{
    document.removeEventListener('pointermove',move); document.removeEventListener('pointerup',up);
    ghost.remove();
    const c=cv(); if(c) c.classList.remove('drop');
    const sh=S.system.sheet;
    if(!moveu){                                   /* clique simples: encaixa no 1º vão livre */
      const spot=freeSpot(sh,t.w,t.h); addBlockAt(key,spot.x,spot.y); return;
    }
    if(!c) return;
    const r=c.getBoundingClientRect(), sc=parseFloat(c.dataset.scale)||1;
    if(!dentro(e,r)) return;                      /* soltou fora: cancela */
    addBlockAt(key, (e.clientX-r.left)/sc - t.w/2, (e.clientY-r.top)/sc - t.h/2);
  };
  document.addEventListener('pointermove',move); document.addEventListener('pointerup',up);
  move(ev);
}
/* acha um lugar livre no canvas para um bloco novo */
function freeSpot(sh,w,h2){
  const bs=sh.blocks;
  for(let y=10;y<4000;y+=GRID){
    for(let x=10;x+w<=CANVAS_W-10;x+=GRID*2){
      const hit=bs.some(b=>x<b.x+b.w && x+w>b.x && y<b.y+b.h && y+h2>b.y);
      if(!hit) return {x,y};
    }
  }
  return {x:10,y:sh.canvasH+10};
}

/* Ferramentas que só fazem sentido com vários blocos selecionados */
function grupoBox(sh,sels){
  const alinhar=como=>{
    pushUndo();
    const xs=sels.map(b=>b.x), ys=sels.map(b=>b.y);
    const dirs=sels.map(b=>b.x+b.w), bots=sels.map(b=>b.y+b.h);
    if(como==='esq'){ const v=Math.min(...xs); sels.forEach(b=>b.x=v); }
    if(como==='dir'){ const v=Math.max(...dirs); sels.forEach(b=>b.x=Math.max(0,v-b.w)); }
    if(como==='topo'){ const v=Math.min(...ys); sels.forEach(b=>b.y=v); }
    if(como==='base'){ const v=Math.max(...bots); sels.forEach(b=>b.y=Math.max(0,v-b.h)); }
    if(como==='centroH'){ const v=(Math.min(...xs)+Math.max(...dirs))/2; sels.forEach(b=>b.x=Math.max(0,Math.round(v-b.w/2))); }
    if(como==='centroV'){ const v=(Math.min(...ys)+Math.max(...bots))/2; sels.forEach(b=>b.y=Math.max(0,Math.round(v-b.h/2))); }
    render();
  };
  const distribuir=eixo=>{
    if(sels.length<3) return showToast('Precisa de 3 blocos ou mais');
    pushUndo();
    const ord=sels.slice().sort((a,b)=>eixo==='x'?(a.x-b.x):(a.y-b.y));
    const ini=eixo==='x'?ord[0].x:ord[0].y;
    const fim=eixo==='x'?(ord[ord.length-1].x+ord[ord.length-1].w):(ord[ord.length-1].y+ord[ord.length-1].h);
    const somaTam=ord.reduce((s,b)=>s+(eixo==='x'?b.w:b.h),0);
    const vao=(fim-ini-somaTam)/(ord.length-1);
    let pos=ini;
    ord.forEach(b=>{ if(eixo==='x'){ b.x=Math.round(pos); pos+=b.w+vao; } else { b.y=Math.round(pos); pos+=b.h+vao; } });
    render();
  };
  const igualar=dim=>{
    pushUndo();
    const alvo=sels[0];
    sels.forEach(b=>{ if(dim==='w') b.w=alvo.w; else if(dim==='h') b.h=alvo.h; else { b.w=alvo.w; b.h=alvo.h; } });
    render();
  };
  return h('div',{class:'req-box',style:{marginTop:'10px'}},
    h('div',{class:'lbl'},'GRUPO — '+sels.length+' BLOCOS'),
    h('div',{class:'hint',style:{marginBottom:'6px'}},'Alinhar entre si:'),
    h('div',{class:'seg'},
      h('button',{title:'Alinhar pela esquerda',onclick:()=>alinhar('esq')},'⇤'),
      h('button',{title:'Centralizar na horizontal',onclick:()=>alinhar('centroH')},'⇔'),
      h('button',{title:'Alinhar pela direita',onclick:()=>alinhar('dir')},'⇥'),
      h('button',{title:'Alinhar pelo topo',onclick:()=>alinhar('topo')},'⤒'),
      h('button',{title:'Centralizar na vertical',onclick:()=>alinhar('centroV')},'⇕'),
      h('button',{title:'Alinhar pela base',onclick:()=>alinhar('base')},'⤓')),
    h('div',{class:'row wrapf',style:{marginTop:'8px'}},
      h('button',{class:'btn sm ghost',title:'Espaçamento igual na horizontal',onclick:()=>distribuir('x')},'⇹ Distribuir H'),
      h('button',{class:'btn sm ghost',title:'Espaçamento igual na vertical',onclick:()=>distribuir('y')},'⇳ Distribuir V')),
    h('div',{class:'row wrapf',style:{marginTop:'6px'}},
      h('button',{class:'btn sm ghost',title:'Mesma largura do primeiro selecionado',onclick:()=>igualar('w')},'↔ Mesma largura'),
      h('button',{class:'btn sm ghost',onclick:()=>igualar('h')},'↕ Mesma altura'),
      h('button',{class:'btn sm ghost',onclick:()=>igualar('wh')},'⧉ Mesmo tamanho')),
    h('div',{class:'hint',style:{marginTop:'6px'}},'O "mesmo tamanho" usa o bloco principal (borda cheia) como referência.'));
}

function featureItem(sys,list,c,kind){
  const isRace=kind==='raca';
  const open=!!S.ui.open[c.id];
  const nAb=(c.abilities||[]).length, nTr=isRace?((c.traits||[]).length):0;
  const header=h('div',{class:'acc-head',onclick:()=>{S.ui.open[c.id]=!open;render();}},
    h('div',{class:'row'}, h('span',{class:'acc-caret'},open?'▼':'▶'), h('span',{class:'acc-title'},c.name||'(sem nome)')),
    h('div',{class:'row'}, h('span',{class:'acc-meta'}, nAb+' hab.'+(isRace?(' · '+nTr+' traços'):'')),
      h('button',{class:'btn danger sm',onclick:e=>{e.stopPropagation();const i=list.indexOf(c);list.splice(i,1);delete S.ui.open[c.id];render();}},'✕')));
  if(!open) return h('div',{class:'acc'}, header);
  const body=h('div',{class:'acc-body'},
    h('div',{style:{marginTop:'12px'}}, field('Nome', h('input',{class:'in',value:c.name,oninput:e=>{c.name=e.target.value;persist();},onchange:()=>render()}))),
    h('div',{style:{marginTop:'8px'}}, field('Descrição', h('textarea',{class:'in',rows:'2',value:c.description||'',oninput:e=>{c.description=e.target.value;persist();}}))),
    isRace?traitEditor(c):null,
    h('div',{class:'sub-h'}, isRace?'Efeitos / Habilidades da raça':'Habilidades da classe'),
    abilityEditor(sys,c),
    /* tabela própria: as colunas daqui valem só para quem tem esta classe e
       sobrescrevem as do sistema quando o nome coincide */
    isRace?null:h('div',{},
      h('div',{class:'sub-h'},'Tabela de progressão desta classe'),
      h('div',{class:'hint',style:{marginTop:'-4px',marginBottom:'8px'}},
        'Só vale para quem escolher esta classe. Serve para recursos que mudam de fórmula por classe (PV/PE por nível, espaços de magia, dado de ataque).'),
      progEditor(sys, (c.progression=sanitizeProg(c.progression)), {})));
  return h('div',{class:'acc'}, header, body);
}
function traitEditor(c){
  if(!c.traits) c.traits=[];
  return h('div',{},
    h('div',{class:'sub-h'},'Características físicas'),
    h('div',{class:'hint',style:{marginTop:'-4px',marginBottom:'8px'}},'Traços do corpo — ex.: Asas, Cauda, Chifres. Nem toda raça tem.'),
    ...c.traits.map(t=>h('div',{class:'trait-row'},
      h('input',{class:'in',style:{maxWidth:'150px'},value:t.name,placeholder:'Ex.: Asas',oninput:e=>{t.name=e.target.value;persist();}}),
      h('input',{class:'in',value:t.description||'',placeholder:'Descrição/efeito',oninput:e=>{t.description=e.target.value;persist();}}),
      h('button',{class:'btn danger sm',onclick:()=>{c.traits=c.traits.filter(x=>x.id!==t.id);render();}},'✕'))),
    h('button',{class:'btn ghost sm',onclick:()=>{c.traits.push({id:uid(),name:'Nova característica',description:''});render();}},'+ Característica'));
}
function abilityEditor(sys, owner){
  if(!owner.abilities) owner.abilities=[];
  const wrap=h('div',{});
  owner.abilities.forEach(ab=>{
    if(!ab.effects) ab.effects=[];
    if(!ab.req) ab.req={level:0,attrs:[]};
    wrap.appendChild(h('div',{class:'ability-card'},
      h('div',{class:'row'},
        h('input',{class:'in',value:ab.name,placeholder:'Nome da habilidade',oninput:e=>{ab.name=e.target.value;persist();},onchange:()=>render()}),
        h('button',{class:'btn danger sm',onclick:()=>{owner.abilities=owner.abilities.filter(x=>x.id!==ab.id);render();}},'✕')),
      h('input',{class:'in',style:{marginTop:'6px'},value:ab.description,placeholder:'O que ela faz (descrição)',oninput:e=>{ab.description=e.target.value;persist();}}),
      reqEditor(sys,ab),
      h('div',{class:'sub-h2'},'Efeitos mecânicos'),
      ...ab.effects.map(ef=>effectRow(sys,ab.effects,ef,0)),
      h('button',{class:'btn ghost sm',onclick:()=>{ab.effects.push(newEffect(sys));render();}},'+ Efeito'),
      h('div',{class:'tags'}, ...reqTags(sys,ab).map(t=>h('span',{class:'tg-req'},'🔒 '+t)), ...ab.effects.map(ef=>h('span',{class:'tg-fx'},effectLabel(sys,ef))))));
  });
  wrap.appendChild(h('button',{class:'btn sm',onclick:()=>{owner.abilities.push({id:uid(),name:'Nova Habilidade',description:'',req:{level:0,attrs:[]},effects:[]});render();}},'+ Habilidade'));
  return wrap;
}
function reqEditor(sys,ab){
  if(!ab.req) ab.req={level:0,attrs:[]};
  return h('div',{class:'req-box'},
    h('div',{class:'lbl'},'REQUISITOS PARA LIBERAR'),
    h('div',{class:'row wrapf',style:{alignItems:'flex-end'}},
      field('Requer nível', h('input',{class:'in',type:'number',style:{width:'90px'},value:ab.req.level||0,onchange:e=>{ab.req.level=parseInt(e.target.value)||0;render();}})),
      h('button',{class:'btn ghost sm',onclick:()=>{ab.req.attrs.push({id:uid(),attrId:(sys.attributes[0]||{}).id,min:1});render();}},'+ Requisito de atributo')),
    ...ab.req.attrs.map(r=>{
      const sel=h('select',{class:'in',style:{maxWidth:'150px'},onchange:e=>{r.attrId=e.target.value;persist();}});
      sys.attributes.forEach(a=>{const o=h('option',{value:a.id},a.name);if(a.id===r.attrId)o.selected=true;sel.appendChild(o);});
      return h('div',{class:'row',style:{marginTop:'6px'}}, sel, h('span',{class:'hint'},'≥'),
        h('input',{class:'in',type:'number',style:{width:'70px'},value:r.min,onchange:e=>{r.min=parseInt(e.target.value)||0;persist();}}),
        h('button',{class:'btn danger sm',onclick:()=>{ab.req.attrs=ab.req.attrs.filter(x=>x.id!==r.id);render();}},'✕'));
    }));
}
function newEffect(sys){ return {id:uid(),kind:'atributo',targetId:(sys.attributes[0]||{}).id||'',value:1,text:'',charType:'tag',mods:[]}; }
/* arr = a lista de efeitos que contém ef (para remover no lugar).
   depth 0 = efeito de topo (oferece "efeito único"); depth 1 = modificação dentro
   de um efeito único (não aninha outro efeito único). */
function effectRow(sys,arr,ef,depth){
  depth=depth||0;
  const kinds=[['atributo','Bônus de Atributo'],['recurso','Bônus de Recurso'],['pericia','Concede Perícia'],
    ['caracteristica','Característica'],['dados','🎲 Modificador de DADOS']];
  if(depth===0) kinds.push(['livre','Efeito único (texto + mods)']);
  const kindSel=h('select',{class:'in',style:{maxWidth:'190px'},onchange:e=>{
    ef.kind=e.target.value;
    if(ef.kind==='atributo')ef.targetId=(sys.attributes[0]||{}).id;
    else if(ef.kind==='recurso')ef.targetId=(sys.resources[0]||{}).id;
    else if(ef.kind==='pericia')ef.targetId=(sys.skills[0]||{}).id;
    else if(ef.kind==='caracteristica'){ if(!ef.charType)ef.charType='tag'; }
    else if(ef.kind==='livre'){ if(!Array.isArray(ef.mods))ef.mods=[]; }
    render();
  }});
  kinds.forEach(([v,l])=>{const o=h('option',{value:v},l);if(v===ef.kind)o.selected=true;kindSel.appendChild(o);});
  const del=h('button',{class:'btn danger sm',onclick:()=>{const i=arr.indexOf(ef);if(i>=0)arr.splice(i,1);render();}},'✕');

  /* CANAL DE DADOS — mexe na QUANTIDADE de dados, não no total (peça 4).
     É o "−1d20" do Ordem: não se converte em número e não some com bônus fixo. */
  if(ef.kind==='dados'){
    const escSel=h('select',{class:'in',style:{maxWidth:'190px'},onchange:e=>{ef.escopo=e.target.value;render();}});
    DICE_ESCOPOS.forEach(([v,l])=>{const o=h('option',{value:v},l);if(v===(ef.escopo||'todos'))o.selected=true;escSel.appendChild(o);});
    return h('div',{},
      h('div',{class:'row wrapf',style:{marginBottom:'4px'}}, kindSel,
        h('input',{class:'in',type:'number',style:{width:'80px'},value:ef.value==null?-1:ef.value,
          title:'Quantidade de dados: −1 tira um dado, +1 acrescenta',
          onchange:e=>{ef.value=parseInt(e.target.value)||0;render();}}),
        h('span',{class:'hint'},'dado(s) em'), escSel, del),
      h('div',{class:'hint',style:{marginBottom:'6px'}},
        'Mexe na quantidade de dados, não no total. Se sobrar 0 dados, a rolagem vira "2 dados, pega o pior".'));
  }

  /* CARACTERÍSTICA — etiqueta (marca) ou numérica (vira variável nas fórmulas) */
  if(ef.kind==='caracteristica'){
    if(!ef.charType) ef.charType='tag';
    const typeSel=h('select',{class:'in',style:{maxWidth:'135px'},onchange:e=>{ef.charType=e.target.value;render();}});
    [['tag','🏷 Etiqueta'],['num','◆ Numérica']].forEach(([v,l])=>{const o=h('option',{value:v},l);if(v===ef.charType)o.selected=true;typeSel.appendChild(o);});
    const nameIn=h('input',{class:'in',style:{maxWidth:'190px'},value:ef.text||'',
      placeholder:ef.charType==='num'?'Ex.: Deslocamento':'Ex.: Visão no escuro',
      oninput:e=>{ef.text=e.target.value;persist();},onchange:()=>render()});
    const valIn=ef.charType==='num'?h('input',{class:'in',type:'number',style:{width:'72px'},value:ef.value||0,onchange:e=>{ef.value=parseInt(e.target.value)||0;render();}}):null;
    return h('div',{}, h('div',{class:'row wrapf',style:{marginBottom:'4px'}}, kindSel, typeSel, nameIn, valIn, del),
      ef.charType==='num'?h('div',{class:'hint',style:{marginBottom:'6px'}},'O nome vira variável: "'+((ef.text||'Nome').trim()||'Nome')+'" pode ser usado nas fórmulas do sistema.'):null);
  }

  /* EFEITO ÚNICO — descrição livre + modificações mecânicas anexadas */
  if(ef.kind==='livre'){
    if(!Array.isArray(ef.mods)) ef.mods=[];
    const desc=h('input',{class:'in',style:{flex:'1',minWidth:'200px'},value:ef.text||'',
      placeholder:'Descreva o efeito único (ex.: Fúria do Berserker)',oninput:e=>{ef.text=e.target.value;persist();},onchange:()=>render()});
    const modsBox=h('div',{class:'req-box',style:{marginTop:'6px'}},
      h('div',{class:'lbl'},'MODIFICAÇÕES DESTE EFEITO'),
      ...ef.mods.map(m=>effectRow(sys,ef.mods,m,1)),
      h('button',{class:'btn ghost sm',onclick:()=>{ef.mods.push(newEffect(sys));render();}},'+ Modificação'),
      h('div',{class:'hint',style:{marginTop:'4px'}},'A descrição é livre; as modificações abaixo batem de verdade na ficha (ex.: +Defesa e +Vida ao mesmo tempo).'));
    return h('div',{style:{marginBottom:'8px'}}, h('div',{class:'row wrapf'}, kindSel, desc, del), modsBox);
  }

  /* atributo / recurso / perícia */
  const listp=ef.kind==='atributo'?sys.attributes:ef.kind==='recurso'?sys.resources:sys.skills;
  const targetCtrl=h('select',{class:'in',onchange:e=>{ef.targetId=e.target.value;render();}});
  listp.forEach(it=>{const o=h('option',{value:it.id},it.name);if(it.id===ef.targetId)o.selected=true;targetCtrl.appendChild(o);});
  const valInput=(ef.kind==='atributo'||ef.kind==='recurso')
    ? h('input',{class:'in',type:'number',style:{width:'72px'},value:ef.value,onchange:e=>{ef.value=parseInt(e.target.value)||0;render();}}) : null;
  return h('div',{class:'row wrapf',style:{marginBottom:'6px'}}, kindSel, targetCtrl, valInput, del);
}

function portCard(){
  const importInput=h('input',{type:'file',accept:'.nexus,.json',class:'hide',
    onchange:e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();
      rd.onload=()=>{try{S.system=JSON.parse(rd.result);S.draft=initDraft(S.system);render();}catch{alert('Arquivo .nexus inválido');}};
      rd.readAsText(f);}});
  return card(tit('Portabilidade do Sistema','nexus'),'É aqui que mora a liberdade: leve seu sistema pra qualquer lugar.',null,
    h('div',{class:'row wrapf'},
      h('button',{class:'btn amber',onclick:exportSystem},'⬇ Exportar .nexus'),
      h('button',{class:'btn',onclick:()=>importInput.click()},'⬆ Importar .nexus'), importInput,
      h('button',{class:'btn ghost',onclick:()=>{if(confirm('Restaurar o sistema de exemplo? Isso substitui o atual.')){S.system=defaultSystem();S.draft=initDraft(S.system);render();}}},'↺ Restaurar exemplo')),
    h('div',{class:'hint',style:{marginTop:'12px'}}, `Sistema atual: ${S.system.attributes.length} atributos • ${S.system.resources.length} recursos • ${S.system.skills.length} perícias • ${S.system.classes.length} classes • ${S.system.origins.length} raças.`));
}
function exportSystem(){
  const blob=new Blob([JSON.stringify(S.system,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=(S.system.campaignName||S.system.name||'sistema').replace(/\s+/g,'_')+'.nexus'; a.click();
  URL.revokeObjectURL(url);
}

/* ============================================================ JOGADOR ============================================================ */
function jogadorView(){
  const sys=S.system, d=S.draft;
  sanitizeDraft(d,sys);
  /* Os passos são dinâmicos: "Escolhas" só existe se o sistema tiver pontos de
     escolha liberados no degrau do personagem. */
  const escolhasDisp=(sys.choices||[]).filter(c=>(c.level||1)<=d.level);
  const passos=[{k:'id',l:'Identidade'},{k:'attr',l:'Atributos'},{k:'skill',l:'Perícias'}];
  if(escolhasDisp.length) passos.push({k:'choice',l:'Escolhas'});
  passos.push({k:'sheet',l:'Ficha'});
  if(S.step>=passos.length) S.step=passos.length-1;
  if(S.step<0) S.step=0;
  const labels=passos.map(p=>p.l);
  const atual=passos[S.step].k;
  const ultimo=S.step===passos.length-1;
  const lp=levelPoints(sys,d.level);
  const eff=gatherEffects(sys,d);
  const effMin=sys.allowDump?sys.attrMin:sys.startAttrValue;
  const used=sys.attributes.reduce((s,a)=>s+((d.attrs[a.id]??0)-sys.startAttrValue),0);
  const left=lp.attrPoints-used;

  const dots=h('div',{class:'dots'});
  labels.forEach((l,i)=>{
    dots.appendChild(h('div',{class:'dot '+(i<S.step?'done':i===S.step?'cur':'')}, i<S.step?'✓':(i+1)));
    dots.appendChild(h('span',{class:'dotlbl '+(i===S.step?'cur':'')},l));
    if(i<labels.length-1) dots.appendChild(h('div',{class:'dotline'}));
  });

  let body, canNext=true;

  if(atual==='id'){
    canNext=!!(d.name.trim() && d.classId && d.originId);
    const levelSel=h('select',{class:'in',onchange:e=>{d.level=parseInt(e.target.value);d.attrs=Object.fromEntries(sys.attributes.map(a=>[a.id,sys.startAttrValue]));d.skills=[];render();}});
    for(let lv=sys.startLevel;lv<=sys.maxLevel;lv++){const o=h('option',{value:lv},levelLabel(sys,lv));if(lv===d.level)o.selected=true;levelSel.appendChild(o);}
    const featBtns=(listp,selKey,isRace)=>listp.map(c=>h('button',{class:'selectable '+(d[selKey]===c.id?'sel-i':''),style:{marginBottom:'8px'},onclick:()=>{d[selKey]=c.id;render();}},
      h('div',{class:'t'},c.name), h('div',{class:'d'},c.description),
      (c.abilities&&c.abilities.length)?h('div',{class:'fx'},'★ '+c.abilities.map(a=>a.name).join(' • ')):null,
      (isRace&&c.traits&&c.traits.length)?h('div',{class:'tr'},'✦ '+c.traits.map(t=>t.name).join(' • ')):null));
    /* P7 — sistema sem classe ou origem travava o jogador em silêncio */
    const faltando=[];
    if(!sys.classes.length) faltando.push('nenhuma classe');
    if(!sys.origins.length) faltando.push('nenhuma origem/raça');
    body=card('Quem é você?','Nome, nível, classe e origem/raça.',null,
      faltando.length?h('div',{class:'aviso'},'⚠ Este sistema tem '+faltando.join(' e ')+
        ' cadastrada(s). Peça ao mestre para criar na aba correspondente — sem isso não dá para avançar.'):null,
      field('Nome do personagem', h('input',{class:'in',value:d.name,placeholder:'Ex: Kára, a andarilha',oninput:e=>{d.name=e.target.value;persist();}})),
      h('div',{style:{marginTop:'10px'}}, field('Nível inicial deste personagem', levelSel)),
      h('div',{class:'hint',style:{margin:'14px 0 6px',color:'#c7d2fe'}},'Classe:'),
      ...featBtns(sys.classes,'classId',false),
      h('div',{class:'hint',style:{margin:'10px 0 6px',color:'#c7d2fe'}},'Origem / Raça:'),
      ...featBtns(sys.origins,'originId',true));
  }
  else if(atual==='attr'){
    canNext=left===0;
    const setAttr=(a,delta)=>{const cur=d.attrs[a.id]??sys.startAttrValue;const nx=cur+delta;
      if(nx<effMin||nx>sys.attrMax)return; if(delta>0&&left<=0)return; d.attrs[a.id]=nx; render();};
    body=card('Distribua seus atributos',
      'Faixa: '+effMin+' a '+sys.attrMax+'. '+(sys.allowDump?'Pode baixar abaixo de '+sys.startAttrValue+' para ganhar pontos.':'')+(sys.attrMode==='modificador'?' (mostrando o modificador)':''),
      h('div',{class:'badge '+(left===0?'ok':'warn')}, left+' pts'),
      ...sys.attributes.map(a=>{const val=d.attrs[a.id]??sys.startAttrValue;const bonus=eff.attrBonus[a.id]||0;const raw=val+bonus;
        return h('div',{class:'attrrow'},
          h('span',{style:{fontWeight:'600'}}, a.name,
            bonus?h('span',{style:{color:'#34d399',fontSize:'12px',marginLeft:'6px'}},'(+'+bonus+' hab.)'):null,
            sys.attrMode==='modificador'?h('span',{class:'attrmod'},'mod '+sign(effAttr(sys,raw))):null),
          h('div',{class:'row'},
            h('button',{class:'btn mini',onclick:()=>setAttr(a,-1)},'−'),
            h('span',{class:'attrval'},val),
            h('button',{class:'btn mini primary',onclick:()=>setAttr(a,1)},'+')));}),
      (()=>{ /* P2 — explicar quando a regra do mestre é impossível de cumprir */
        if(left===0) return null;
        const teto=sys.attributes.length*(sys.attrMax-sys.startAttrValue);
        if(lp.attrPoints>teto) return h('div',{class:'aviso'},
          '⚠ O mestre deu '+lp.attrPoints+' pontos, mas o máximo que cabe é '+teto+
          ' ('+sys.attributes.length+' atributos × '+(sys.attrMax-sys.startAttrValue)+'). Avise o mestre: a regra está impossível.');
        if(left<0) return h('div',{class:'aviso'},'⚠ Você gastou '+(-left)+' ponto(s) a mais.');
        return h('div',{class:'hint',style:{color:'#fbbf24',marginTop:'8px'}},'Distribua todos os pontos para continuar.');
      })());
  }
  else if(atual==='skill'){
    const choosable=sys.skills.filter(s=>!s.auto);
    canNext=d.skills.length===lp.skillCount;
    const toggle=id=>{const has=d.skills.includes(id); if(!has&&d.skills.length>=lp.skillCount)return;
      d.skills=has?d.skills.filter(x=>x!==id):[...d.skills,id];
      /* ao escolher, já entra no primeiro grau que dá valor (peça 2) */
      if(!has && sys.profMode!=='nenhum'){
        const t=(sys.profTiers||[]).find(x=>(sys.profMode==='mult'?x.mult:x.bonus)>0);
        if(t) d.skillTier[id]=t.id;
      }
      render();};
    const autoNames=sys.skills.filter(s=>s.auto).map(s=>s.name);
    const grantedNames=eff.grantedSkills.map(id=>(sys.skills.find(s=>s.id===id)||{}).name).filter(Boolean);
    /* P2 — explicar o bloqueio em vez de só desabilitar o botão */
    const impossivel = lp.skillCount>choosable.length
      ? 'O mestre pediu '+lp.skillCount+' perícias, mas só existem '+choosable.length+' escolhíveis. Avise o mestre: a regra está impossível.'
      : null;
    /* peça 2: seletor de grau para cada perícia que o personagem tem */
    const tierBox=(sys.profMode==='nenhum'||!(sys.profTiers||[]).length)?null:h('div',{style:{marginTop:'14px'}},
      h('div',{class:'hint',style:{marginBottom:'6px',color:'#c7d2fe'}},'Grau de treino:'),
      ...skillRows(sys,d,computeSheet(sys,d)).map(r=>{
        const sel=h('select',{class:'in',style:{maxWidth:'160px'},onchange:e=>{d.skillTier[r.s.id]=e.target.value;render();}});
        sel.appendChild(h('option',{value:''},'— destreinado —'));
        (sys.profTiers||[]).forEach(t=>{const o=h('option',{value:t.id},t.name);if(t.id===(d.skillTier||{})[r.s.id])o.selected=true;sel.appendChild(o);});
        return h('div',{class:'row between',style:{marginBottom:'6px'}},
          h('span',{style:{fontWeight:'600',fontSize:'13px'}},r.s.name),
          h('div',{class:'row'}, sel, h('span',{class:'attrval'},sign(r.value))));
      }));
    body=card('Escolha suas perícias','Escolha exatamente '+lp.skillCount+'.',
      h('div',{class:'badge '+(canNext?'ok':'warn')}, d.skills.length+'/'+lp.skillCount),
      impossivel?h('div',{class:'aviso'},'⚠ '+impossivel):null,
      h('div',{class:'skillgrid'}, ...choosable.map(s=>{const on=d.skills.includes(s.id);const granted=eff.grantedSkills.includes(s.id);
        return h('button',{class:'selectable '+(on?'sel-e':''),onclick:()=>toggle(s.id),title:s.description||''},
          (on?'✓ ':'')+s.name+(granted?'  (concedida)':''));})),
      autoNames.length?h('div',{class:'hint',style:{marginTop:'10px'}},'Automáticas (todos têm): '+autoNames.join(', ')):null,
      grantedNames.length?h('div',{class:'hint',style:{marginTop:'4px'}},'Concedidas por classe/raça: '+grantedNames.join(', ')):null,
      tierBox);
  }
  /* PEÇA 1 — passo de pontos de escolha */
  else if(atual==='choice'){
    const pend=[];
    const blocos=escolhasDisp.map(ch=>{
      const sel=(d.choices[ch.id]||[]);
      const falta=ch.count-sel.length;
      if(falta>0) pend.push(ch.name+' ('+falta+')');
      const marcar=op=>{
        const tem=sel.includes(op.id);
        let nova;
        if(tem) nova=sel.filter(x=>x!==op.id);
        else{
          if(sel.length>=ch.count) return;
          if(!ch.repetivel && sel.includes(op.id)) return;
          nova=[...sel,op.id];
        }
        d.choices[ch.id]=nova; render();
      };
      /* uma opção fica travada se o requisito dela não for cumprido */
      const travada=op=>{
        const r=op.req||{}; const out=[];
        if(r.level&&d.level<r.level) out.push((sys.levelName||'Nível')+' '+r.level);
        (r.attrs||[]).forEach(rq=>{ const tot=(d.attrs[rq.attrId]||0)+(eff.attrBonus[rq.attrId]||0);
          if(tot<rq.min){const a=sys.attributes.find(x=>x.id===rq.attrId);out.push((a?a.name:'?')+' '+rq.min+'+');} });
        (r.choices||[]).forEach(oid=>{
          const escolhida=Object.values(d.choices||{}).some(arr=>(arr||[]).includes(oid));
          if(!escolhida){ let nome='outra opção';
            (sys.choices||[]).forEach(c=>(c.options||[]).forEach(o=>{if(o.id===oid)nome=o.name;}));
            out.push('Requer: '+nome); } });
        return out;
      };
      return card(ch.name, ch.hint||('Escolha '+ch.count+'.'),
        h('div',{class:'badge '+(falta<=0?'ok':'warn')}, sel.length+'/'+ch.count),
        ...(ch.options||[]).map(op=>{
          const on=sel.includes(op.id);
          const rs=travada(op);
          const fx=(op.effects||[]).map(ef=>effectLabel(sys,ef));
          return h('button',{class:'selectable '+(on?'sel-i':'')+(rs.length?' opt-locked':''),
            style:{marginBottom:'8px'}, disabled:!!rs.length && !on,
            onclick:()=>{ if(rs.length&&!on) return showToast('Travada: '+rs.join(', ')); marcar(op); }},
            h('div',{class:'t'},(on?'✓ ':'')+(rs.length?'🔒 ':'')+op.name),
            op.description?h('div',{class:'d'},op.description):null,
            fx.length?h('div',{class:'fx'},fx.join('  •  ')):null,
            rs.length?h('div',{class:'tr',style:{color:'#fbbf24'}},'Requer: '+rs.join(', ')):null);
        }),
        (ch.options||[]).length?null:h('div',{class:'hint'},'O mestre não cadastrou nenhuma opção para esta escolha.'));
    });
    canNext=pend.length===0;
    body=h('div',{}, ...blocos,
      pend.length?h('div',{class:'hint',style:{color:'#fbbf24',marginTop:'8px'}},'Falta escolher: '+pend.join(', ')):null);
  }
  else body=finalSheet(sys,d);

  const nav=h('div',{class:'row between',style:{marginTop:'4px'}},
    h('button',{class:'btn ghost',disabled:S.step===0,onclick:()=>{if(S.step>0){S.step--;render();}}},'← Voltar'),
    !ultimo ? h('button',{class:'btn primary',disabled:!canNext,onclick:()=>{if(canNext){S.step++;render();}}},'Avançar →') : h('span'));

  const themeChips=(sys.themes||[]).map(t=>h('span',{class:'pill'},t));
  return h('div',{class:'wrap-sm'},
    h('div',{class:'row',style:{justifyContent:'flex-end',marginBottom:'12px'}},
      h('button',{class:'btn ghost',onclick:()=>{S.draft=initDraft(sys);S.step=0;render();}},'↻ Recomeçar ficha')),
    h('div',{class:'note',html:'🎲 Campanha <b>“'+esc(sys.campaignName||'')+'”</b> — sistema <b>“'+esc(sys.name)+'”</b>. O app te guia e impede erros.'}),
    themeChips.length?h('div',{class:'row wrapf',style:{marginBottom:'14px'}},...themeChips):null,
    dots, body, nav,
    S.saved.length?h('div',{style:{textAlign:'center',fontSize:'11px',color:'#64748b',marginTop:'14px'}},S.saved.length+' ficha(s) salva(s) neste dispositivo.'):null);
}

/* ---------- Cálculo + montagem da ficha (dirigida pelo layout do mestre) ---------- */
function computeSheet(sys,d){
  const eff=gatherEffects(sys,d);
  const varsTotal={'Nível':d.level,'Nivel':d.level};
  /* o eixo também responde pelo nome que o mestre deu (NEX, Grau…) */
  if(sys.levelName && !varsTotal[sys.levelName]) varsTotal[sys.levelName]=d.level;
  const totals={}, effById={};
  sys.attributes.forEach(a=>{const base=d.attrs[a.id]??0;const bonus=eff.attrBonus[a.id]||0;const raw=base+bonus;
    const ev=effAttr(sys,raw); totals[a.id]={base,bonus,raw,eff:ev}; effById[a.id]=ev; varsTotal[a.name]=ev;});
  /* colunas da tabela de progressão (globais + da classe) viram variáveis */
  Object.assign(varsTotal, progVars(sys,d));
  /* características numéricas (Deslocamento, Resist. a fogo…) também viram variáveis,
     sem sobrescrever nada que já exista (atributo/coluna com mesmo nome vence) */
  for(const k in eff.charNum){ if(!(k in varsTotal)) varsTotal[k]=eff.charNum[k]; }
  /* PEÇA 2 — valor de proficiência do degrau atual, disponível como variável */
  let profVal=0;
  if(sys.profMode!=='nenhum' && (sys.profFormula||'').trim()){
    const p=evalFormula(sys.profFormula,varsTotal); if(!Number.isNaN(p)) profVal=p;
  }
  if(!('Proficiência' in varsTotal)) varsTotal['Proficiência']=profVal;
  if(!('Proficiencia' in varsTotal)) varsTotal['Proficiencia']=profVal;

  /* PEÇA 6 — armadura que DEFINE a fórmula do recurso, em vez de só somar.
     Vence a de maior valor entre as equipadas; os bônus continuam somando por cima. */
  const armaduras={};
  eff.equipped.forEach(({it})=>{
    const ar=it.armor||{}; if(!ar.on||!ar.resId||!(ar.formula||'').trim()) return;
    const vA={...varsTotal};
    if(ar.maxAttrId){ const a=sys.attributes.find(x=>x.id===ar.maxAttrId);
      if(a) vA[a.name]=Math.min(vA[a.name]||0, ar.maxAttrVal||0); }   /* teto de destreza */
    const v=evalFormula(ar.formula,vA);
    if(Number.isNaN(v)) return;
    if(!armaduras[ar.resId] || v>armaduras[ar.resId].v) armaduras[ar.resId]={v,it};
  });

  const allRes=sys.resources.map(r=>{
    const arm=armaduras[r.id];
    let v = arm ? arm.v : evalFormula(r.formula,varsTotal);
    if(!Number.isNaN(v))v+=(eff.resBonus[r.id]||0);
    let cur=d.resCurrent[r.id];
    /* o valor atual nunca passa do máximo (P3): se o mestre baixar a fórmula,
       a ficha acompanha em vez de exibir "999 / 25" */
    if(cur!=null && !Number.isNaN(v)) cur=Math.max(0,Math.min(cur,v));
    let pr=null;
    if(r.perRound&&r.perRound.trim()){ const x=evalFormula(r.perRound,varsTotal); if(!Number.isNaN(x)) pr=x; }
    return {...r,max:v,cur:cur==null?v:cur,perRoundVal:pr,armadura:arm?arm.it.name:null};});

  /* PEÇA 2 — valor final de cada perícia, já com o multiplicador de proficiência */
  const skillVal=(s)=>{
    const base=s.linkedAttrId?(effById[s.linkedAttrId]||0):0;
    if(sys.profMode==='nenhum') return base+(s.trainedBonus||0);
    const tier=(sys.profTiers||[]).find(t=>t.id===(d.skillTier||{})[s.id]);
    if(!tier) return base;
    return base + (sys.profMode==='mult' ? Math.floor(profVal*(tier.mult||0)) : (tier.bonus||0));
  };

  /* carga: soma do peso do inventário (× quantidade) vs. Carga Máxima */
  let peso=0; (d.inventory||[]).forEach(entry=>{const it=(sys.items||[]).find(x=>x.id===entry.itemId);
    if(it) peso+=(+it.weight||0)*Math.max(1,entry.qtd||1);});
  const cargaMax=(sys.cargaFormula&&sys.cargaFormula.trim())?evalFormula(sys.cargaFormula,varsTotal):null;
  const carga={peso,max:cargaMax};

  /* PEÇA 6 — ataques vindos das armas equipadas */
  const ataques=eff.equipped.filter(({it})=>it.attack&&it.attack.on).map(({it})=>{
    const at=it.attack;
    let bonus=0; const partes=[];
    if(at.attrId){ const a=sys.attributes.find(x=>x.id===at.attrId);
      if(a){ bonus+=(effById[a.id]||0); partes.push(a.name); } }
    if(at.skillId){ const s=(sys.skills||[]).find(x=>x.id===at.skillId);
      if(s){ bonus+=skillVal(s); partes.push(s.name); } }
    return {it, at, bonus, partes, tags:at.tags||[]};
  });

  /* PEÇA 6 — sintonização: teto global de itens sintonizados */
  const sintonizados=(d.inventory||[]).filter(e=>{const it=(sys.items||[]).find(x=>x.id===e.itemId);
    return it&&it.sintonia&&e.attuned;}).length;

  /* PEÇA 6 — ocupação de slots */
  const slotUso={};
  eff.equipped.forEach(({it})=>{ if(it.slotId) slotUso[it.slotId]=(slotUso[it.slotId]||0)+1; });

  return {eff,varsTotal,totals,effById,allRes,carga,profVal,skillVal,ataques,
          sintonizados,slotUso,armaduras};
}
/* ============ Conteúdo de cada bloco ============
   mode: 'edit' (editor do mestre) | 'preview' (exemplo) | 'play' (ficha do jogador)
   Só no modo 'play' o conteúdo é interativo. */
function recursosInner(sys,d,ctx,b,mode){
  const bars=ctx.allRes.filter(r=>(r.type||'barra')!=='valor');
  if(!bars.length) return h('div',{class:'hint'},'Nenhum recurso do tipo barra.');
  /* Os botões aparecem também no editor (inertes, via pointer-events:none):
     o mestre precisa dimensionar o bloco vendo o mesmo conteúdo do jogador. */
  const ctrl=b.opts.controls!==false;
  const setRes=(id,cur,max)=>{d.resCurrent[id]=Math.max(0,Math.min(max,cur));render();};
  const temDescanso=(tipo)=>bars.some(r=>(r.recharge||{}).trig===tipo);
  const barraDescanso=(b.opts.showRest!==false && (temDescanso('curto')||temDescanso('longo')))
    ? h('div',{class:'row wrapf',style:{marginBottom:'10px',paddingBottom:'8px',borderBottom:'1px dashed var(--line)'}},
        temDescanso('curto')?h('button',{class:'btn sm',title:'Recupera os recursos marcados como "descanso curto"',
          onclick:()=>aplicarDescanso('curto')},'☕ Descanso curto'):null,
        temDescanso('longo')?h('button',{class:'btn sm emerald',title:'Recupera os recursos marcados como "descanso longo"',
          onclick:()=>aplicarDescanso('longo')},'🌙 Descanso longo'):null)
    : null;
  return h('div',{}, barraDescanso, ...bars.map(r=>h('div',{style:{marginBottom:'12px'}},
    h('div',{class:'row between',style:{fontSize:'13px',marginBottom:'4px'}},
      h('span',{style:{fontWeight:'600'}},r.name,
        (ctx.eff.resBonus[r.id]?h('span',{style:{color:'#34d399',fontSize:'11px',marginLeft:'6px'}},'(+'+ctx.eff.resBonus[r.id]+' hab.)'):null),
        (r.perRoundVal!=null?h('span',{class:'hint',style:{marginLeft:'6px'}},'· máx '+r.perRoundVal+'/rodada'):null)),
      h('span',{class:'hint'}, r.cur+' / '+(Number.isNaN(r.max)?'—':r.max))),
    h('div',{class:'bar-t'}, h('div',{class:'bar-f',style:{width:((Number.isNaN(r.max)||r.max<=0)?0:Math.min(100,(r.cur/r.max)*100))+'%',background:r.color}})),
    ctrl?h('div',{class:'row',style:{marginTop:'6px'}},
      h('button',{class:'btn sm',onclick:()=>setRes(r.id,r.cur-1,r.max)},'−1'),
      h('button',{class:'btn sm',onclick:()=>setRes(r.id,r.cur+1,r.max)},'+1'),
      h('button',{class:'btn sm danger',onclick:()=>setRes(r.id,r.cur-5,r.max)},'Dano 5'),
      h('button',{class:'btn sm',onclick:()=>setRes(r.id,r.max,r.max)},'Cheio')):null)));
}
/* Inventário: carga + lista de itens do personagem, com equipar/remover e adicionar do catálogo.
   Os controles aparecem também no editor (inertes via pointer-events:none) para o
   mestre dimensionar o bloco vendo o mesmo conteúdo do jogador (Regra Aprendida #9). */
function inventarioInner(sys,d,ctx,b,mode){
  const cat=sys.items||[];
  if(!d.inventory) d.inventory=[];
  const inv=d.inventory;
  const carga=ctx.carga||{peso:0,max:null};
  const temMax=carga.max!=null && !Number.isNaN(carga.max);
  const over=temMax && carga.peso>carga.max;
  const cargaNode=h('div',{style:{marginBottom:'10px'}},
    h('div',{class:'row between',style:{fontSize:'13px',marginBottom:'4px'}},
      h('span',{style:{fontWeight:'600'}},'Carga',
        over?h('span',{style:{color:'#fb7185',marginLeft:'6px',fontSize:'11px'}},'⚠ sobrecarregado'):null),
      h('span',{class:'hint'}, (Math.round(carga.peso*10)/10)+(temMax?(' / '+carga.max):' (sem limite)'))),
    temMax?h('div',{class:'bar-t'}, h('div',{class:'bar-f',style:{width:Math.min(100,carga.max>0?(carga.peso/carga.max*100):0)+'%',background:over?'#fb7185':'#f59e0b'}})):null);
  if(!cat.length) return h('div',{}, cargaNode, h('div',{class:'hint'},'O mestre ainda não cadastrou itens (aba 🎒 Itens).'));

  /* peça 6: ocupação de slots e teto de sintonização */
  const slotBar=(sys.slots||[]).length?h('div',{class:'row wrapf',style:{marginBottom:'8px'}},
    ...(sys.slots||[]).map(s=>{const uso=(ctx.slotUso||{})[s.id]||0; const cheio=uso>s.max;
      return h('span',{class:'tg-fx',style:{borderColor:cheio?'#fb7185':null,color:cheio?'#fb7185':null}},
        s.name+' '+uso+'/'+s.max);})):null;
  const sintBar=(sys.sintoniaMax||0)>0?h('div',{class:'hint',style:{marginBottom:'8px',
    color:(ctx.sintonizados>sys.sintoniaMax)?'#fb7185':null}},
    '✦ Sintonizados: '+ctx.sintonizados+' / '+sys.sintoniaMax+
    ((ctx.sintonizados>sys.sintoniaMax)?'  ⚠ acima do limite':'')):null;

  const linhas=inv.map(entry=>{
    const it=cat.find(x=>x.id===entry.itemId); if(!it) return null;
    const fx=(it.effects||[]).map(ef=>effectLabel(sys,ef));
    const equ=it.equipavel&&entry.equipped;
    const semSintonia = it.sintonia && (sys.sintoniaMax||0)>0 && !entry.attuned;
    const slot=(sys.slots||[]).find(s=>s.id===it.slotId);
    return h('div',{class:'item',style:{marginBottom:'6px',opacity:(it.equipavel&&!entry.equipped)?'.72':'1'}},
      h('div',{class:'row between'},
        h('div',{}, h('span',{style:{fontWeight:'700'}},it.name),
          (entry.qtd>1)?h('span',{class:'tg-fx',style:{marginLeft:'6px'}},'×'+entry.qtd):null,
          h('span',{class:'hint',style:{marginLeft:'6px'}},
            itemCatLabel(it.categoria)+(it.weight?(' · '+(Math.round(it.weight*Math.max(1,entry.qtd||1)*10)/10)+' peso'):'')+
            (slot?(' · '+slot.name):''))),
        h('div',{class:'row'},
          it.empilhavel?h('div',{class:'row',style:{gap:'2px'}},
            h('button',{class:'btn mini',onclick:()=>{entry.qtd=Math.max(1,(entry.qtd||1)-1);render();}},'−'),
            h('span',{class:'attrval',style:{minWidth:'22px'}},entry.qtd||1),
            h('button',{class:'btn mini',onclick:()=>{entry.qtd=(entry.qtd||1)+1;render();}},'+')):null,
          (it.sintonia&&(sys.sintoniaMax||0)>0)?h('button',{class:'btn sm '+(entry.attuned?'emerald':'ghost'),
            title:'Sintonizar (teto global: '+sys.sintoniaMax+')',
            onclick:()=>{
              if(!entry.attuned && ctx.sintonizados>=sys.sintoniaMax) return showToast('Limite de sintonização atingido ('+sys.sintoniaMax+')');
              entry.attuned=!entry.attuned;render();}},entry.attuned?'✦ Sintonizado':'✦ Sintonizar'):null,
          it.equipavel?h('button',{class:'btn sm '+(equ?'emerald':'ghost'),
            onclick:()=>{entry.equipped=!entry.equipped;render();}}, equ?'✓ Equipado':'Equipar'):null,
          h('button',{class:'btn sm danger',onclick:()=>{const i=inv.indexOf(entry);if(i>=0)inv.splice(i,1);render();}},'✕'))),
      it.description?h('div',{class:'hint',style:{marginTop:'2px'}},it.description):null,
      (equ&&semSintonia)?h('div',{class:'hint',style:{color:'#fbbf24',marginTop:'2px'}},'⚠ Equipado, mas sem sintonia — os efeitos não se aplicam.'):null,
      fx.length?h('div',{class:'tags',style:{marginTop:'4px'}}, ...fx.map(t=>h('span',{class:'tg-fx'},(equ&&!semSintonia)||!it.equipavel?t:('· '+t)))):null);
  }).filter(Boolean);

  const addSel=h('select',{class:'in',style:{maxWidth:'240px'},onchange:e=>{const id=e.target.value;
    if(!id) return;
    const it=cat.find(x=>x.id===id);
    const ja=it&&it.empilhavel?inv.find(x=>x.itemId===id):null;
    if(ja) ja.qtd=(ja.qtd||1)+1; else inv.push({iid:uid(),itemId:id,equipped:false,qtd:1,attuned:false});
    render();}});
  addSel.appendChild(h('option',{value:''},'+ adicionar item…'));
  cat.forEach(it=>addSel.appendChild(h('option',{value:it.id},it.name)));

  return h('div',{}, cargaNode, slotBar, sintBar,
    linhas.length?h('div',{},...linhas):h('div',{class:'hint',style:{marginBottom:'6px'}},'Inventário vazio — adicione itens abaixo.'),
    h('div',{class:'row',style:{marginTop:'6px'}}, addSel));
}
/* caixas de atributo/valor, compartilhadas pelos blocos 'atributos' e 'valores' */
function statBoxes(sys,ctx,which){
  if(which==='valores'){
    return ctx.allRes.filter(r=>(r.type||'barra')==='valor').map(r=>({
      name:r.name, abbr:(r.name||'?').slice(0,3).toUpperCase(), main:Number.isNaN(r.max)?'—':r.max,
      sub:ctx.eff.resBonus[r.id]?('+'+ctx.eff.resBonus[r.id]+' hab.'):'', color:r.color}));
  }
  return sys.attributes.map(a=>{const t=ctx.totals[a.id];
    return {name:a.name, abbr:attrAbbr(a),
      main: sys.attrMode==='modificador'?t.raw:t.eff,
      sub: sys.attrMode==='modificador'?('mod '+sign(t.eff)):(t.bonus?('base '+t.base+' +'+t.bonus):''),
      color:null};});
}
/* Uma peça estilizada (hexágono/círculo/losango/escudo/octógono/caixa).
   Contorno: caixa e círculo usam border; as formas com clip-path usam a técnica
   de duas camadas (a de baixo é a cor da borda, a de cima é o preenchimento). */
/* Fração da largura aproveitável por forma: as afuniladas (losango, escudo)
   têm bem menos espaço útil que a caixa, senão o texto vaza pelas pontas.
   [largura útil, deslocamento vertical do texto] */
const SHAPE_FIT={ caixa:[.86,0], circulo:[.72,0], octogono:[.76,0], hexagono:[.70,0], escudo:[.66,-.07], losango:[.52,0] };
function shapeNode(o,item){
  const size=Math.max(30,o.shSize||96);
  const clip=SHAPE_CLIP[o.shape];
  const sw=Math.max(0,Math.min(12,o.strokeW==null?3:o.strokeW));
  const fontCls=o.font==='serif'?'f-serif':o.font==='display'?'f-display':o.font==='mono'?'f-mono':'';
  const numSz=Math.max(10,o.numSize||30);
  const fit=SHAPE_FIT[o.shape]||[.8,0];
  const txt=h('div',{class:'shape-txt '+fontCls,style:{color:o.txtColor||'#fff',
    width:(size*fit[0])+'px', maxHeight:(size*(o.shape==='losango'?.6:.8))+'px', overflow:'hidden',
    transform:fit[1]?('translateY('+(fit[1]*100)+'%)'):null}},
    o.nameOnTop&&o.showName?h('div',{class:'shape-nm',style:{fontSize:Math.max(7,numSz*0.28)+'px'}},item.name):null,
    h('div',{class:'shape-num',style:{fontSize:numSz+'px'}},item.main),
    (!o.nameOnTop&&o.showName)?h('div',{class:'shape-nm',style:{fontSize:Math.max(7,numSz*0.28)+'px'}},item.name):null,
    o.showAbbr&&item.abbr?h('div',{class:'shape-ab',style:{fontSize:Math.max(9,numSz*0.42)+'px'}},item.abbr):null,
    (o.showBonus&&item.sub)?h('div',{class:'shape-sub',style:{fontSize:Math.max(7,numSz*0.24)+'px'}},item.sub):null);

  const wrap=h('div',{class:'shape'});
  wrap.style.width=size+'px'; wrap.style.height=size+'px';
  if(clip){
    const outer=h('div',{style:{position:'absolute',inset:'0',clipPath:clip,background:sw>0?(o.stroke||'#c7d2fe'):(o.fill||'#0f1729')}});
    const inner=h('div',{style:{position:'absolute',inset:sw+'px',clipPath:clip,background:o.fill||'#0f1729'}});
    wrap.appendChild(outer); wrap.appendChild(inner);
  }else{
    const base=h('div',{style:{position:'absolute',inset:'0',background:o.fill||'#0f1729',
      border:sw>0?(sw+'px solid '+(o.stroke||'#c7d2fe')):'none',
      borderRadius:o.shape==='circulo'?'50%':'12px'}});
    wrap.appendChild(base);
  }
  wrap.appendChild(txt);
  return wrap;
}
/* Arranjo FLOR: peças distribuídas em roseta ao redor de um núcleo, como a
   referência de Ordem Paranormal (AGI no topo, e as demais girando em volta). */
function florInner(o,items){
  const n=items.length;
  const size=Math.max(30,o.shSize||96);
  if(!n) return h('div',{class:'hint'},'Nenhum atributo.');
  /* raio automático: encosta as peças sem sobrepor, seja qual for a quantidade.
     (lado de um polígono regular de n vértices = 2*r*sen(pi/n)) */
  const auto = n<2 ? 0 : Math.round((size+ (o.shGap==null?8:o.shGap)) / (2*Math.sin(Math.PI/n)));
  const r = Math.max(0, o.radius==null?auto:o.radius);
  const W = 2*r + size + 4;
  const box=h('div',{style:{position:'relative',width:W+'px',height:W+'px',margin:'0 auto'}});
  const a0 = (o.startAngle==null?-90:o.startAngle);
  if(o.hub!==false){
    /* Núcleo automático = o vão livre no meio da roseta (2 × distância do centro até
       a borda interna das peças). Maior que isso e as peças comem o texto. */
    const vao = Math.max(40, Math.round(2*(r - size*0.5)));
    const hs = o.hubSize==null ? vao : o.hubSize;
    const fontCls=o.font==='serif'?'f-serif':o.font==='display'?'f-display':o.font==='mono'?'f-mono':'';
    const texto=(o.hubText||'');
    /* A fonte encolhe conforme o texto cresce. Nada de overflow:hidden aqui — isso
       CORTAVA a palavra ("ATRIBUTO" sem o S). Melhor letra menor que letra faltando. */
    const fs=Math.max(7, Math.min(hs*0.15, hs*1.0/Math.max(1,texto.length)));
    box.appendChild(h('div',{class:'hub '+fontCls,style:{width:hs+'px',height:hs+'px',
      left:(W/2-hs/2)+'px', top:(W/2-hs/2)+'px', background:o.hubFill||'#0b1020', color:o.hubTxt||'#fff',
      fontSize:fs+'px'}}, texto));
  }
  items.forEach((it,i)=>{
    const ang=(a0 + i*360/n) * Math.PI/180;
    const p=shapeNode(o,it);
    p.style.position='absolute';
    p.style.left=(W/2 + r*Math.cos(ang) - size/2)+'px';
    p.style.top =(W/2 + r*Math.sin(ang) - size/2)+'px';
    p.style.zIndex='1';
    box.appendChild(p);
  });
  return box;
}
function shapesInner(o,items){
  if(o.arranjo==='flor') return florInner(o,items);
  const cols=Math.max(1,Math.min(8,o.cols||5));
  const size=Math.max(30,o.shSize||96), gap=Math.max(0,o.shGap==null?8:o.shGap);
  const hive=o.arranjo==='colmeia'&&o.shape==='hexagono';
  const box=h('div',{class:'shapes'});
  for(let i=0;i<items.length;i+=cols){
    const linha=items.slice(i,i+cols);
    const r=i/cols;
    const row=h('div',{class:'shrow',style:{gap:gap+'px'}});
    /* colmeia: linhas ímpares deslocadas meia peça e encaixadas para cima */
    if(hive){ row.style.marginLeft=(r%2?(size/2+gap/2):0)+'px'; if(r>0) row.style.marginTop=(-size*0.26)+'px'; }
    else if(r>0){ row.style.marginTop=gap+'px'; }
    linha.forEach(it=>row.appendChild(shapeNode(o,it)));
    box.appendChild(row);
  }
  return box;
}

/* ---- Foto: upload real, reduzida e guardada como base64 (offline) ---- */
function readPhoto(file,cb){
  if(!file) return;
  if(!/^image\//.test(file.type)) return alert('Selecione um arquivo de imagem.');
  const rd=new FileReader();
  rd.onerror=()=>alert('Não foi possível ler o arquivo.');
  rd.onload=()=>{
    const img=new Image();
    img.onerror=()=>alert('Imagem inválida ou corrompida.');
    img.onload=()=>{
      const MAX=320, sc=Math.min(1, MAX/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(img.width*sc)); c.height=Math.max(1,Math.round(img.height*sc));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      cb(c.toDataURL('image/jpeg',0.82));
    };
    img.src=rd.result;
  };
  rd.readAsDataURL(file);
}
