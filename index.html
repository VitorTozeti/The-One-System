<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nexus RPG — Protótipo</title>
<!--
  Nexus RPG — Protótipo (Mestre + Jogador)
  100% OFFLINE. Sem internet, sem CDN, sem instalação, sem build.
  Abra este arquivo com dois cliques. Dados salvos no navegador (LocalStorage).

  O código foi separado em arquivos por responsabilidade (ver pasta /src e /assets).
  Os scripts usam funções/variáveis GLOBAIS e são carregados como scripts clássicos
  (não como módulos ES), justamente para continuar funcionando via file:// sem servidor.
  A ORDEM dos <script> abaixo importa: cada arquivo depende dos anteriores.
-->
<link rel="stylesheet" href="assets/css/styles.css" />
<link rel="stylesheet" href="assets/css/sistema.css" />
<link rel="stylesheet" href="assets/css/mapa.css" />
<link rel="stylesheet" href="assets/css/campanha.css" />
<link rel="stylesheet" href="assets/css/ficha-viva.css" />
</head>
<body>
<div id="root"></div>

<!-- 1) Núcleo: helpers e motores (sem dependências de UI) -->
<script src="src/ui/temas.js"></script>
<script src="src/core/helpers.js"></script>
<script src="src/ui/icones.js"></script>
<script src="src/core/formula-engine.js"></script>
<script src="src/core/dice-engine.js"></script>
<script src="src/ui/dialogs.js"></script>

<!-- 2) Dados: sistema de exemplo, migração e criação de ficha -->
<script src="src/data/example-system.js"></script>
<script src="src/data/sistema-modelos.js"></script>

<!-- 2b) Contas/auth (camada de dados) — precisa de helpers, example-system; antes do estado -->
<script src="src/auth/accounts.js"></script>

<!-- 2c) Modelo de campanha (dados) — usado por bindPersonagem; antes do estado -->
<script src="src/master/campaign/campaign-model.js"></script>

<!-- 3) Estado global e histórico (dependem de helpers + dados + contas) -->
<script src="src/core/state.js"></script>
<script src="src/core/history.js"></script>

<!-- 4) UI compartilhada -->
<script src="src/ui/shortcuts.js"></script>
<script src="src/ui/ui-basic.js"></script>
<script src="src/ui/glossary.js"></script>
<script src="src/ui/formula-field.js"></script>
<script src="src/ui/atributos-pericias.js"></script>
<script src="src/ui/ficha-viva.js"></script>
<script src="src/ui/versoes.js"></script>
<script src="src/ui/bibliotecas.js"></script>
<script src="src/ui/bibliotecas-extra.js"></script>
<script src="src/ui/tour.js"></script>
<script src="src/ui/wizard.js"></script>

<!-- 4b) Telas de login/cadastro e hub de personagens -->
<script src="src/auth/auth-ui.js"></script>

<!-- 5) Telas do Mestre -->
<script src="src/master/master-nav.js"></script>
<script src="src/master/master-pieces.js"></script>

<!-- 6) Tela do Jogador -->
<script src="src/player/player.js"></script>

<!-- 6b) Dashboard de campanha do Mestre (usa canvasNode, rollExpr, mestreView) -->
<script src="src/master/campaign/dashboard.js"></script>
<script src="src/master/campaign/campaign-dice.js"></script>
<script src="src/master/campaign/players.js"></script>
<script src="src/master/campaign/bestiary.js"></script>
<script src="src/master/campaign/mesa-mapa.js"></script>
<script src="src/master/campaign/campaign-items.js"></script>
<script src="src/master/campaign/sessions.js"></script>
<script src="src/master/campaign/initiative.js"></script>
<script src="src/master/campaign/handouts.js"></script>
<script src="src/master/campaign/table-tools.js"></script>
<script src="src/master/campaign/campaign-io.js"></script>
<script src="src/master/campaign/presentation.js"></script>
<!-- ^ Mesa ao vivo: diário, combate, notas/busca, ferramentas, backup .campanha e tela dos jogadores (presentation.js por último: assume a janela #tela-jogadores) -->

<!-- 7) App: monta o cabeçalho e dispara o render() inicial (deve ser o ÚLTIMO) -->
<script src="src/app.js"></script>
</body>
</html>
